[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picasso-rag-chat"
version = "0.1.0"
description = "Model-driven RAG-based conversational AI service for Picasso AI creative brief capture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.4",
    "httpx>=0.27.0",
    "openai>=1.51.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.8.0",
    "sse-starlette>=2.1.3",
    "alembic>=1.13.3",
    "python-multipart>=0.0.12",
    "sentence-transformers>=3.0.0",
    "groq>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "live: marks tests that call external APIs (OpenAI, pgvector) — deselect with -m 'not live'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
