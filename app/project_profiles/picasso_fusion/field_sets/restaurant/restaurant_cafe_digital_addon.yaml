template_key: restaurant_cafe_digital_addon
template_label: Digital Asset
vertical: restaurant
template_name_match:
  - digital design
  - digital add-on
  - digital addon
  - digital brief
  - digital asset
fields:
  - code: post_purpose
    kind: radio
    required: true
    section_name: Digital Asset & Message
    section_order: 0
    section_field_order: 0
    question: What are we creating today?
    hint: Select the digital asset.
    options:
      - label: Website Banner
        value: website_banner
      - label: Homepage Hero Banner
        value: homepage_hero_banner
      - label: Email Newsletter (EDM)
        value: email_newsletter_edm
      - label: Email Header
        value: email_header
      - label: Google Display Ads
        value: google_display_ads
      - label: Meta Ad Creative
        value: meta_ad_creative
      - label: Instagram Story Set
        value: instagram_story_set
      - label: WhatsApp Promotional Graphic
        value: whatsapp_promotional_graphic
      - label: Digital Menu Board
        value: digital_menu_board
      - label: Digital Signage
        value: digital_signage
      - label: Presentation Deck
        value: presentation_deck
      - label: Website Popup
        value: website_popup
      - label: Other
        value: other
  - code: promoted_item
    kind: text
    required: true
    section_name: Digital Asset & Message
    section_order: 0
    section_field_order: 1
    question: What are we promoting?
    hint: 'Provide the key details: Dish/Menu/Event Name, Category, Price (Optional),
      Key Ingredients/Highlights.'
  - code: key_message
    kind: text
    required: true
    section_name: Digital Asset & Message
    section_order: 0
    section_field_order: 2
    question: What's the ONE message customers should remember?
    hint: 'Describe the biggest takeaway after seeing this digital asset. Example:
      "Try our new wood-fired pizzas.", "Weekend brunch is now available.", "Order
      directly and enjoy exclusive offers."'
  - code: post_goal
    kind: checkbox
    required: true
    section_name: Goal & Audience
    section_order: 1
    section_field_order: 0
    question: What's the goal of this digital asset?
    options:
      - label: Increase Restaurant Visits
        value: increase_restaurant_visits
      - label: Increase Online Orders
        value: increase_online_orders
      - label: Promote a Dish
        value: promote_a_dish
      - label: Launch a New Menu
        value: launch_a_new_menu
      - label: Promote an Offer
        value: promote_an_offer
      - label: Increase Reservations
        value: increase_reservations
      - label: Build Brand Awareness
        value: build_brand_awareness
      - label: Event Promotion
        value: event_promotion
      - label: Drive Website Traffic
        value: drive_website_traffic
      - label: Other
        value: other
  - code: target_audience
    kind: text
    required: true
    section_name: Goal & Audience
    section_order: 1
    section_field_order: 1
    question: Who is this campaign for?
    hint: Describe your ideal customer.
  - code: offer_type
    kind: radio
    required: true
    section_name: Offer
    section_order: 2
    section_field_order: 0
    question: Are you running an offer?
    options:
      - label: No Offer
        value: no_offer
      - label: Percentage Discount
        value: percentage_discount
      - label: Combo Offer
        value: combo_offer
      - label: Happy Hour
        value: happy_hour
      - label: Buy One Get One
        value: buy_one_get_one
      - label: Free Dessert
        value: free_dessert
      - label: Limited-Time Menu
        value: limited_time_menu
      - label: Other
        value: other
  - code: offer_details
    kind: text
    required: false
    section_name: Offer
    section_order: 2
    section_field_order: 1
    question: Provide the offer details, start & end date, and terms & conditions.
    hint: Only if you are running an offer.
    show_if:
      field: offer_type
      not_in:
        - no_offer
  - code: already_have_content
    kind: radio
    required: true
    section_name: Content
    section_order: 3
    section_field_order: 0
    question: Do you already have the content?
    options:
      - label: Final Copy Ready
        value: final_copy_ready
      - label: Rough Points
        value: rough_points
      - label: Need Copywriting Support
        value: need_copywriting_support
  - code: copy_content
    kind: text
    required: false
    section_name: Content
    section_order: 3
    section_field_order: 1
    question: Provide your copy or rough points.
    hint: Only if you have final copy ready or rough points.
  - code: design_requirements
    kind: checkbox
    required: false
    section_name: Design Requirements
    section_order: 4
    section_field_order: 0
    question: Is there anything that must appear?
    hint: Select all that apply.
    options:
      - label: Dish Name
        value: dish_name
      - label: Menu Name
        value: menu_name
      - label: Price
        value: price
      - label: Offer
        value: offer
      - label: Brand Logo
        value: brand_logo
      - label: Restaurant Address
        value: restaurant_address
      - label: Contact Number
        value: contact_number
      - label: QR Code
        value: qr_code
      - label: Website
        value: website
      - label: Reservation Link
        value: reservation_link
      - label: Delivery Partner Logos
        value: delivery_partner_logos
      - label: Social Media Handles
        value: social_media_handles
      - label: CTA Button
        value: cta_button
      - label: Other
        value: other
  - code: have_images_or
    kind: checkbox
    required: true
    section_name: Images & Assets
    section_order: 5
    section_field_order: 0
    question: Do you have images or assets?
    options:
      - label: I'll Upload Food Photos
        value: ill_upload_food_photos
      - label: I'll Upload Restaurant Ambience Photos
        value: ill_upload_restaurant_ambience_photos
      - label: I'll Upload Menu Graphics
        value: ill_upload_menu_graphics
      - label: I'll Upload Logos and Brand Assets
        value: ill_upload_logos_and_brand_assets
      - label: Use Stock Images Where Suitable
        value: use_stock_images_where_suitable
      - label: Use Only Brand Assets
        value: use_only_brand_assets
      - label: Designer Can Recommend
        value: designer_can_recommend
  - code: uploaded_files
    kind: file
    required: false
    section_name: Images & Assets
    section_order: 5
    section_field_order: 1
    question: Upload your files.
    hint: 'Upload food photography, restaurant images, menus, logos, or supporting
      assets. Recommended formats: PNG, JPG, SVG, PDF.'
    show_if:
      field: have_images_or
      in:
        - ill_upload_food_photos
        - ill_upload_restaurant_ambience_photos
        - ill_upload_menu_graphics
        - ill_upload_logos_and_brand_assets
  - code: brand_identity_choice
    kind: radio
    required: true
    section_name: Brand Assets
    section_order: 6
    section_field_order: 0
    question: Would you like us to follow your existing brand identity?
    hint: "This is about your BRAND IDENTITY (logo, colors, fonts, guidelines) \u2014\
      \ separate from any photos or videos you may have already uploaded."
    options:
      - label: Use My Saved Brand Kit
        value: use_my_saved_brand_kit
      - label: Upload Brand Guidelines
        value: upload_brand_guidelines
      - label: Upload Logo & Assets
        value: upload_logo_assets
      - label: Customize This Project
        value: customize_this_project
  - code: brand_customization
    kind: checkbox
    required: false
    section_name: Brand Assets
    section_order: 6
    section_field_order: 1
    question: What should we customize?
    hint: Only if you selected "Customize This Project" above.
    options:
      - label: Brand Colors
        value: brand_colors
      - label: Brand Fonts
        value: brand_fonts
      - label: Additional Instructions
        value: additional_instructions
    show_if:
      field: brand_customization
      in:
        - customize_this_project
  - code: brand_customization_details
    kind: text
    required: false
    section_name: Brand Assets
    section_order: 6
    section_field_order: 2
    question: Provide any additional brand customization details.
    hint: Only if you selected "Customize This Project" above.
    show_if:
      field: brand_customization
      in:
        - customize_this_project

  - code: brand_uploaded_files
    kind: file
    required: false
    section_name: Brand Assets
    section_field_order: 3
    question: Please upload your brand files.
    hint: Upload your logo, brand guidelines, or any other brand assets (PNG, JPG, PDF, AI, EPS).
    show_if:
      field: brand_identity_choice
      in:
        - upload_brand_guidelines
        - upload_logo_assets
  - code: should_this_digital
    kind: checkbox
    required: true
    section_name: Style & References
    section_order: 7
    section_field_order: 0
    question: How should this digital asset feel?
    hint: Choose up to 3.
    options:
      - label: Premium
        value: premium
      - label: Luxury
        value: luxury
      - label: Rustic
        value: rustic
      - label: Modern
        value: modern
      - label: Minimal
        value: minimal
      - label: Warm
        value: warm
      - label: Cozy
        value: cozy
      - label: Editorial
        value: editorial
      - label: Vibrant
        value: vibrant
      - label: Fresh & Bright
        value: fresh_bright
      - label: Dark & Moody
        value: dark_moody
      - label: Match My Brand Style
        value: match_my_brand_style
  - code: inspiration_type
    kind: checkbox
    required: false
    section_name: Style & References
    section_order: 7
    section_field_order: 1
    question: Do you have any inspiration?
    hint: Share digital designs you like.
    options:
      - label: Website Link
        value: website_link
      - label: Instagram Link
        value: instagram_link
      - label: Pinterest Link
        value: pinterest_link
      - label: Upload Images
        value: upload_images
      - label: Skip
        value: skip
  - code: inspiration_links
    kind: text
    required: false
    section_name: Style & References
    section_order: 7
    section_field_order: 2
    question: Provide the reference link(s), or note that you're uploading images.
    hint: Only if you selected a reference option above (not Skip).
    show_if:
      field: inspiration_type
      not_in:
        - skip
  - code: where_will_this
    kind: checkbox
    required: true
    section_name: Placement & Format
    section_order: 8
    section_field_order: 0
    question: Where will this asset be used?
    options:
      - label: Website
        value: website
      - label: Email Campaign
        value: email_campaign
      - label: Google Ads
        value: google_ads
      - label: Meta Ads
        value: meta_ads
      - label: Instagram Stories
        value: instagram_stories
      - label: Facebook
        value: facebook
      - label: WhatsApp
        value: whatsapp
      - label: Digital Menu Board
        value: digital_menu_board
      - label: In-Restaurant Display
        value: in_restaurant_display
      - label: Presentation
        value: presentation
      - label: Other
        value: other
  - code: size_or_format
    kind: radio
    required: true
    section_name: Placement & Format
    section_order: 8
    section_field_order: 1
    question: What size or format do you need?
    options:
      - label: Standard Platform Size
        value: standard_platform_size
      - label: Multiple Platform Sizes
        value: multiple_platform_sizes
      - label: Custom Dimensions
        value: custom_dimensions
  - code: provide_width_height
    kind: text
    required: false
    section_name: Placement & Format
    section_order: 8
    section_field_order: 2
    question: "Provide the width \xD7 height in pixels."
    hint: Only if you selected Custom Dimensions above.
  - code: copy_language
    kind: checkbox
    required: true
    section_name: Language & Notes
    section_order: 9
    section_field_order: 0
    question: What language should the design use?
    options:
      - label: English
        value: english
      - label: Hindi
        value: hindi
      - label: Tamil
        value: tamil
      - label: Telugu
        value: telugu
      - label: Malayalam
        value: malayalam
      - label: Kannada
        value: kannada
      - label: Arabic
        value: arabic
      - label: Spanish
        value: spanish
      - label: French
        value: french
      - label: German
        value: german
      - label: Portuguese
        value: portuguese
      - label: Chinese
        value: chinese
      - label: Japanese
        value: japanese
      - label: Korean
        value: korean
      - label: Urdu
        value: urdu
      - label: Other
        value: other
  - code: avoid_notes
    kind: text
    required: false
    section_name: Language & Notes
    section_order: 9
    section_field_order: 1
    question: Is there anything you'd like us to avoid?
    hint: Mention any colours, imagery, wording, or visual styles you'd prefer not
      to use.
