template_key: restaurant_cafe_static_post
template_label: Static Post
vertical: restaurant
template_name_match:
  - static post
  - static post set
  - social media post
  - post set
fields:
  - code: post_purpose
    kind: radio
    required: true
    section_name: Post Purpose & Product
    section_order: 0
    section_field_order: 0
    question: What are we creating today?
    hint: Select the purpose of this post.
    options:
      - label: Featured Dish
        value: featured_dish
      - label: New Menu Item
        value: new_menu_item
      - label: Seasonal Special
        value: seasonal_special
      - label: Chef's Recommendation
        value: chefs_recommendation
      - label: Combo / Meal Offer
        value: combo_meal_offer
      - label: Happy Hour
        value: happy_hour
      - label: Festival Special
        value: festival_special
      - label: Event Promotion
        value: event_promotion
      - label: Customer Review
        value: customer_review
      - label: Restaurant Ambience
        value: restaurant_ambience
      - label: Behind the Kitchen
        value: behind_the_kitchen
      - label: Brand Awareness
        value: brand_awareness
      - label: Delivery Promotion
        value: delivery_promotion
      - label: Other
        value: other
  - code: promoted_item
    kind: text
    required: true
    section_name: Post Purpose & Product
    section_order: 0
    section_field_order: 1
    question: What are we promoting?
    hint: 'Provide the key details: Dish/Menu/Event Name, Category, Price (Optional),
      Key Ingredients/Highlights.'
  - code: launch_date_time
    kind: text
    required: false
    section_name: Post Purpose & Product
    section_field_order: 2
    question: When is this going to be launched? (Date and time)
    hint: Provide the exact or approximate launch date and time.
    show_if:
      field: post_purpose
      in:
        - new_menu_item
        - seasonal_special
        - combo_meal_offer
        - event_promotion
        - product_launch
        - new_collection
        - limited_edition
        - flash_sale
  - code: key_message
    kind: text
    required: true
    section_name: Post Purpose & Product
    section_order: 0
    section_field_order: 2
    question: What's the ONE message customers should remember?
    hint: 'Describe the biggest reason someone should visit or order. Example: "Freshly
      baked every morning.", "Limited-time mango dessert.", "Weekend brunch you can''t
      miss."'
  - code: post_goal
    kind: checkbox
    required: true
    section_name: Goal & Audience
    section_order: 1
    section_field_order: 0
    question: What's the goal of this post?
    options:
      - label: Increase Restaurant Visits
        value: increase_restaurant_visits
      - label: Increase Online Orders
        value: increase_online_orders
      - label: Promote a Dish
        value: promote_a_dish
      - label: Launch a New Menu
        value: launch_a_new_menu
      - label: Promote an Offer
        value: promote_an_offer
      - label: Build Brand Awareness
        value: build_brand_awareness
      - label: Increase Reservations
        value: increase_reservations
      - label: Promote an Event
        value: promote_an_event
      - label: Other
        value: other
  - code: target_audience
    kind: text
    required: true
    section_name: Goal & Audience
    section_order: 1
    section_field_order: 1
    question: Who is this post for?
    hint: Describe your ideal customer.
  - code: offer_type
    kind: radio
    required: true
    section_name: Offer
    section_order: 2
    section_field_order: 0
    question: Are you running an offer?
    options:
      - label: No Offer
        value: no_offer
      - label: Percentage Discount
        value: percentage_discount
      - label: Combo Offer
        value: combo_offer
      - label: Happy Hour
        value: happy_hour
      - label: Buy One Get One
        value: buy_one_get_one
      - label: Free Dessert
        value: free_dessert
      - label: Limited-Time Menu
        value: limited_time_menu
      - label: Other
        value: other
  - code: offer_details
    kind: text
    required: false
    section_name: Offer
    section_order: 2
    section_field_order: 1
    question: Provide the offer details, start & end date, and terms & conditions.
    hint: Only if you are running an offer.
    show_if:
      field: offer_type
      not_in:
        - no_offer
  - code: copy_status
    kind: radio
    required: true
    section_name: Copy
    section_order: 3
    section_field_order: 0
    question: Do you already have the copy?
    options:
      - label: Final Copy Ready
        value: final_copy_ready
      - label: Rough Points
        value: rough_points
      - label: Need Copywriting Support
        value: need_copywriting_support
  - code: copy_content
    kind: text
    required: false
    section_name: Copy
    section_order: 3
    section_field_order: 1
    question: Provide your copy or rough points.
    hint: Only if you have final copy ready or rough points.
    show_if:
      field: copy_status
      in:
        - final_copy_ready
        - rough_points
  - code: design_requirements
    kind: checkbox
    required: false
    section_name: Design Requirements
    section_order: 4
    section_field_order: 0
    question: Is there anything that must appear?
    hint: Select all that apply.
    options:
      - label: Dish Name
        value: dish_name
      - label: Price
        value: price
      - label: Offer
        value: offer
      - label: Restaurant Logo
        value: restaurant_logo
      - label: Address
        value: address
      - label: Contact Number
        value: contact_number
      - label: QR Code
        value: qr_code
      - label: Reservation Link
        value: reservation_link
      - label: Delivery Partner Logos
        value: delivery_partner_logos
      - label: Social Media Handles
        value: social_media_handles
      - label: Other
        value: other
  - code: asset_availability
    kind: checkbox
    required: true
    section_name: Images & Assets
    section_order: 5
    section_field_order: 0
    question: Do you have photos or assets?
    options:
      - label: I'll Upload Food Photos
        value: ill_upload_food_photos
      - label: I'll Upload Restaurant Ambience Photos
        value: ill_upload_restaurant_ambience_photos
      - label: I'll Upload Chef/Team Photos
        value: ill_upload_chef_team_photos
      - label: I'll Upload All Available Assets
        value: ill_upload_all_available_assets
      - label: Use Stock Images Where Suitable
        value: use_stock_images_where_suitable
      - label: Use Only Brand Assets
        value: use_only_brand_assets
      - label: Designer Can Recommend
        value: designer_can_recommend
  - code: uploaded_files
    kind: file
    required: false
    section_name: Images & Assets
    section_order: 5
    section_field_order: 1
    question: Upload your files.
    hint: Upload food photography, restaurant images, logos, menus, or supporting
      assets.
    show_if:
      field: asset_availability
      in:
        - ill_upload_food_photos
        - ill_upload_restaurant_ambience_photos
        - ill_upload_chef_team_photos
        - ill_upload_all_available_assets
  - code: brand_identity_choice
    kind: radio
    required: true
    section_name: Brand Assets
    section_order: 6
    section_field_order: 0
    question: For your Brand Logo and Colors, would you like to use your saved brand kit, upload your logo files, or customize from scratch?
    hint: "This is about your BRAND IDENTITY (logo, colors, fonts, guidelines) \u2014\
      \ separate from any photos or videos you may have already uploaded."
    options:
      - label: Use My Saved Brand Kit
        value: use_my_saved_brand_kit
      - label: Upload Brand Guidelines
        value: upload_brand_guidelines
      - label: Upload Logo Files
        value: upload_logo_assets
      - label: Customize This Project
        value: customize_this_project
  - code: brand_customization
    kind: checkbox
    required: false
    section_name: Brand Assets
    section_order: 6
    section_field_order: 1
    question: What should we customize?
    hint: Only if you selected "Customize This Project" above.
    options:
      - label: Brand Colors
        value: brand_colors
      - label: Brand Fonts
        value: brand_fonts
      - label: Additional Instructions
        value: additional_instructions
    show_if:
      field: brand_identity_choice
      in:
        - customize_this_project
  - code: brand_customization_details
    kind: text
    required: false
    section_name: Brand Assets
    section_order: 6
    section_field_order: 2
    question: Provide any additional brand customization details.
    hint: Only if you selected "Customize This Project" above.
    show_if:
      field: brand_identity_choice
      in:
        - customize_this_project

  - code: brand_uploaded_files
    kind: file
    required: false
    section_name: Brand Assets
    section_field_order: 3
    question: Please upload your brand files.
    hint: Upload your logo, brand guidelines, or any other brand assets (PNG, JPG, PDF, AI, EPS).
    show_if:
      field: brand_identity_choice
      in:
        - upload_brand_guidelines
        - upload_logo_assets
  - code: visual_style
    kind: checkbox
    required: true
    section_name: Style & References
    section_order: 7
    section_field_order: 0
    question: What visual style should this post have?
    hint: Choose up to 3.
    options:
      - label: Premium
        value: premium
      - label: Luxury
        value: luxury
      - label: Rustic
        value: rustic
      - label: Modern
        value: modern
      - label: Minimal
        value: minimal
      - label: Warm
        value: warm
      - label: Cozy
        value: cozy
      - label: Vibrant
        value: vibrant
      - label: Editorial
        value: editorial
      - label: Dark & Moody
        value: dark_moody
      - label: Fresh & Bright
        value: fresh_bright
      - label: Match My Brand Style
        value: match_my_brand_style
  - code: inspiration_type
    kind: checkbox
    required: false
    section_name: Style & References
    section_order: 7
    section_field_order: 1
    question: Do you have any inspiration?
    hint: Share posts or brands you like.
    options:
      - label: Instagram Link
        value: instagram_link
      - label: Pinterest Link
        value: pinterest_link
      - label: Website Link
        value: website_link
      - label: Upload Reference Images
        value: upload_reference_images
      - label: Skip
        value: skip
  - code: inspiration_links
    kind: text
    required: false
    section_name: Style & References
    section_order: 7
    section_field_order: 2
    question: Provide the reference link(s), or note that you're uploading images.
    hint: Only if you selected a reference option above (not Skip).
    show_if:
      field: inspiration_type
      not_in:
        - skip
  - code: publish_platforms
    kind: checkbox
    required: true
    section_name: Publishing & Language
    section_order: 8
    section_field_order: 0
    question: Where will this post be published?
    options:
      - label: Instagram Feed (1:1)
        value: instagram_feed_1_1
      - label: Instagram Portrait (4:5)
        value: instagram_portrait_4_5
      - label: Facebook
        value: facebook
      - label: LinkedIn
        value: linkedin
      - label: X
        value: x
      - label: Multiple Platforms
        value: multiple_platforms
      - label: Custom Size
        value: custom_size
  - code: copy_language
    kind: checkbox
    required: true
    section_name: Publishing & Language
    section_order: 8
    section_field_order: 1
    question: What language should the copy use?
    hint: You can select multiple languages if needed.
    options:
      - label: English
        value: english
      - label: Hindi
        value: hindi
      - label: Tamil
        value: tamil
      - label: Telugu
        value: telugu
      - label: Malayalam
        value: malayalam
      - label: Kannada
        value: kannada
      - label: Arabic
        value: arabic
      - label: Spanish
        value: spanish
      - label: French
        value: french
      - label: German
        value: german
      - label: Portuguese
        value: portuguese
      - label: Chinese
        value: chinese
      - label: Japanese
        value: japanese
      - label: Korean
        value: korean
      - label: Urdu
        value: urdu
      - label: Other
        value: other
  - code: avoid_notes
    kind: text
    required: false
    section_name: Additional Notes
    section_order: 9
    section_field_order: 0
    question: Is there anything you'd like us to avoid?
    hint: Mention any colours, imagery, wording, or visual styles you'd prefer not
      to use.
