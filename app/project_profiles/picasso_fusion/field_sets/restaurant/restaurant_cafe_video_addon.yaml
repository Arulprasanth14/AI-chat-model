  kind: text
  required: true
  section_name: Video Purpose & Product
  section_order: 0
  section_field_order: 2
  question: What's the ONE message customers should remember?
  hint: 'Describe the biggest takeaway after watching the video. Example: "Fresh pasta
    made daily.", "Our summer menu is now available.", "Reserve your table for our
    live music night."'
