template_key: real_estate_cma_presentation
template_label: CMA Presentation
vertical: realestate
template_name_match:
  - cma
  - comparative market analysis
fields:
  - code: property_this_cma
    kind: text
    required: true
    section_name: CMA Overview
    section_order: 0
    section_field_order: 0
    question: What property is this CMA being prepared for? Give the property address
      and suburb.
  - code: content_structure
    kind: radio
    required: true
    section_name: CMA Overview
    section_order: 0
    section_field_order: 1
    question: What type of property is it?
    options:
      - label: House
        value: house
      - label: Apartment
        value: apartment
      - label: Townhouse
        value: townhouse
      - label: Villa
        value: villa
      - label: Land
        value: land
      - label: Commercial Property
        value: commercial
      - label: Other
        value: other
  - code: post_purpose
    kind: radio
    required: true
    section_name: CMA Overview
    section_order: 0
    section_field_order: 2
    question: What is the purpose of this CMA?
    hint: "This is more useful than asking \"What type of presentation is this?\"\
      \ \u2014 the asset is already a CMA."
    options:
      - label: Listing Appointment
        value: listing_appointment
      - label: Vendor Meeting
        value: vendor_meeting
      - label: Property Valuation Discussion
        value: valuation_discussion
      - label: Market Update
        value: market_update
      - label: Pre-Sale Consultation
        value: pre_sale_consultation
      - label: Other
        value: other
  - code: key_property_details
    kind: text
    required: true
    section_name: Property Information
    section_order: 1
    section_field_order: 0
    question: What are the key property details?
    hint: 'Examples: bedrooms, bathrooms, car spaces, land size, building area, year
      built.'
  - code: propertys_key_selling
    kind: checkbox
    required: true
    section_name: Property Information
    section_order: 1
    section_field_order: 1
    question: What are the property's key selling points?
    options:
      - label: Renovated
        value: renovated
      - label: Waterfront
        value: waterfront
      - label: School Zone
        value: school_zone
      - label: Corner Block
        value: corner_block
      - label: Development Potential
        value: development_potential
      - label: Luxury Finishes
        value: luxury_finishes
      - label: Other
        value: other
  - code: comparable_sales_should
    kind: text
    required: true
    section_name: Comparable Sales Data
    section_order: 2
    section_field_order: 0
    question: What comparable sales should be included? Please provide all comparable
      properties and sale information.
  - code: please_upload_comparable
    kind: file
    required: true
    section_name: Comparable Sales Data
    section_order: 2
    section_field_order: 1
    question: Please upload comparable sales data.
    hint: 'Accepted formats: Excel, PDF, CSV, property reports.'
  - code: should_active_listings
    kind: radio
    required: true
    section_name: Comparable Sales Data
    section_order: 2
    section_field_order: 2
    question: Should active listings or pending sales be included?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: market_data_should
    kind: checkbox
    required: true
    section_name: Market Insights
    section_order: 3
    section_field_order: 0
    question: What market data should be included?
    options:
      - label: Median sale price
        value: median_sale_price
      - label: Days on market
        value: days_on_market
      - label: Sales volume
        value: sales_volume
      - label: Auction clearance rates
        value: clearance_rates
      - label: Market trends
        value: market_trends
      - label: Rental data
        value: rental_data
      - label: Other
        value: other
  - code: please_upload_any
    kind: file
    required: false
    section_name: Market Insights
    section_order: 3
    section_field_order: 1
    question: Please upload any market data and reports.
  - code: have_property_photography
    kind: file
    required: true
    section_name: Assets
    section_order: 4
    section_field_order: 0
    question: Do you have property photography to include? Please upload the images.
  - code: have_any_additional
    kind: checkbox
    required: true
    section_name: Assets
    section_order: 4
    section_field_order: 1
    question: Do you have any additional assets?
    options:
      - label: Maps
        value: maps
      - label: Floor Plans
        value: floor_plans
      - label: Location Highlights
        value: location_highlights
      - label: Lifestyle Photography
        value: lifestyle_photography
      - label: Agent Profile
        value: agent_profile
      - label: Other
        value: other
      - label: None
        value: none
  - code: slide_count
    kind: radio
    required: true
    section_name: Presentation Structure
    section_order: 5
    section_field_order: 0
    question: Approximately how many slides are required?
    options:
      - label: "8\u201312 Slides"
        value: 8-12
      - label: "12\u201315 Slides"
        value: 12-15
      - label: Custom
        value: custom
  - code: have_an_existing
    kind: file
    required: false
    section_name: Presentation Structure
    section_order: 5
    section_field_order: 1
    question: Do you have an existing CMA template or previous presentation to follow?
      Please upload the existing files.
  - code: should_presentation_conclude
    kind: radio
    required: true
    section_name: Closing & CTA
    section_order: 6
    section_field_order: 0
    question: What should the presentation conclude with?
    options:
      - label: Recommended Price Range
        value: recommended_price_range
      - label: Suggested Marketing Strategy
        value: marketing_strategy
      - label: Listing Proposal
        value: listing_proposal
      - label: Book Listing Appointment
        value: book_listing_appointment
      - label: Contact Agent
        value: contact_agent
      - label: Other
        value: other
  - code: will_a_qr
    kind: radio
    required: true
    section_name: Closing & CTA
    section_order: 6
    section_field_order: 1
    question: Will a QR code be included?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: should_qr_code
    kind: text
    required: false
    section_name: Closing & CTA
    section_order: 6
    section_field_order: 2
    question: What should the QR code destination URL be?
    hint: Only ask this if the client said yes to including a QR code.
  - code: any_cma_presentations
    kind: file
    required: false
    section_name: Design Direction
    section_order: 7
    section_field_order: 0
    question: Any CMA presentations or real estate reports you'd like us to reference?
    hint: Upload reference presentations, up to 3.
  - code: describe_desired_presentation
    kind: radio
    required: true
    section_name: Design Direction
    section_order: 7
    section_field_order: 1
    question: Describe the desired presentation style.
    options:
      - label: Premium Real Estate
        value: premium_real_estate
      - label: Luxury
        value: luxury
      - label: Modern Corporate
        value: modern_corporate
      - label: Data-Driven
        value: data_driven
      - label: Editorial
        value: editorial
      - label: Other
        value: other
  - code: format_required
    kind: radio
    required: true
    section_name: Delivery Requirements
    section_order: 8
    section_field_order: 0
    question: What format is required?
    options:
      - label: PowerPoint (.pptx)
        value: pptx
      - label: Google Slides
        value: google_slides
      - label: PDF
        value: pdf
      - label: Multiple Formats
        value: multiple
  - code: will_cma_be
    kind: radio
    required: true
    section_name: Delivery Requirements
    section_order: 8
    section_field_order: 1
    question: Will the CMA be presented live or sent as a standalone document?
    hint: "A critical question that's easy to miss \u2014 a live presentation can\
      \ be visually lighter, while a standalone CMA needs more explanatory content."
    options:
      - label: Presented Live
        value: presented_live
      - label: Sent as PDF
        value: sent_as_pdf
      - label: Both
        value: both
