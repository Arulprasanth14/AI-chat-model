template_key: real_estate_market_report
template_label: Real Estate Market Report
vertical: realestate
template_name_match:
  - market report
fields:
  - code: market_or_area
    kind: radio
    required: true
    section_name: Report Overview
    section_order: 0
    section_field_order: 0
    question: What market or area does this report cover?
    options:
      - label: Suburb Market Report
        value: suburb
      - label: City Market Report
        value: city
      - label: Commercial Property Market
        value: commercial
      - label: Rental Market Report
        value: rental
      - label: Luxury Property Market
        value: luxury
      - label: Investment Market Report
        value: investment
      - label: Other
        value: other
  - code: reporting_period_does
    kind: radio
    required: true
    section_name: Report Overview
    section_order: 0
    section_field_order: 1
    question: What reporting period does this report cover?
    options:
      - label: Monthly
        value: monthly
      - label: Quarterly
        value: quarterly
      - label: Half-Yearly
        value: half_yearly
      - label: Annual
        value: annual
      - label: Custom Date Range
        value: custom_range
  - code: post_goal
    kind: checkbox
    required: true
    section_name: Report Overview
    section_order: 0
    section_field_order: 2
    question: What is the primary goal of this report?
    options:
      - label: Generate seller leads
        value: generate_seller_leads
      - label: Position the agency as a market expert
        value: market_expert_positioning
      - label: Inform property owners
        value: inform_owners
      - label: Attract investors
        value: attract_investors
      - label: Support marketing campaigns
        value: support_campaigns
      - label: Other
        value: other
  - code: format_required
    kind: radio
    required: true
    section_name: Report Format
    section_order: 1
    section_field_order: 0
    question: What format is required?
    hint: "This is critical \u2014 the layout changes significantly depending on distribution."
    options:
      - label: Printed Report
        value: printed
      - label: Digital PDF
        value: digital_pdf
      - label: LinkedIn PDF Carousel
        value: linkedin_carousel
      - label: Email Attachment
        value: email_attachment
      - label: Both Print & Digital
        value: both
  - code: many_pages_should
    kind: radio
    required: true
    section_name: Report Format
    section_order: 1
    section_field_order: 1
    question: How many pages should the report contain?
    options:
      - label: 4 Pages
        value: '4'
      - label: 8 Pages
        value: '8'
      - label: 12 Pages
        value: '12'
      - label: Custom
        value: custom
  - code: data_and_insights
    kind: checkbox
    required: true
    section_name: Content & Data
    section_order: 2
    section_field_order: 0
    question: What data and insights should be included?
    options:
      - label: Median sale price
        value: median_sale_price
      - label: Median rent
        value: median_rent
      - label: Days on market
        value: days_on_market
      - label: Clearance rates
        value: clearance_rates
      - label: Sales volume
        value: sales_volume
      - label: Rental yield
        value: rental_yield
      - label: Market trends
        value: market_trends
      - label: Demographic insights
        value: demographic_insights
      - label: Other
        value: other
  - code: have_data_prepared
    kind: radio
    required: true
    section_name: Content & Data
    section_order: 2
    section_field_order: 1
    question: Do you have the data prepared?
    options:
      - label: Yes, final data ready
        value: final_ready
      - label: Partial data available
        value: partial
      - label: Need help organising data
        value: need_help
  - code: please_upload_your
    kind: file
    required: true
    section_name: Content & Data
    section_order: 2
    section_field_order: 2
    question: Please upload your data files.
    hint: 'Accepted formats: Excel, CSV, PDF, Google Sheets export.'
  - code: written_commentary_or
    kind: text
    required: true
    section_name: Content & Data
    section_order: 2
    section_field_order: 3
    question: What written commentary or analysis should appear in the report? Please
      provide final, approved copy.
  - code: should_any_charts
    kind: radio
    required: true
    section_name: Charts & Visuals
    section_order: 3
    section_field_order: 0
    question: Should any charts, graphs, or infographics be included?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: have_existing_charts
    kind: radio
    required: false
    section_name: Charts & Visuals
    section_order: 3
    section_field_order: 1
    question: Do you have existing charts, or should they be designed from the supplied
      data?
    hint: Only ask this if the client said yes to including charts above.
    options:
      - label: I have existing charts to provide
        value: existing_charts
      - label: Design from the supplied data
        value: design_from_data
      - label: Other
        value: other
  - code: have_photography_or
    kind: file
    required: false
    section_name: Charts & Visuals
    section_order: 3
    section_field_order: 2
    question: Do you have photography or imagery for the report? Please upload the
      images.
    hint: Minimum 300 DPI for print.
  - code: action_should_readers
    kind: radio
    required: true
    section_name: Call to Action
    section_order: 4
    section_field_order: 0
    question: What action should readers take after reading the report?
    options:
      - label: Request a property appraisal
        value: request_appraisal
      - label: Contact an agent
        value: contact_agent
      - label: Download a full report
        value: download_report
      - label: Book a consultation
        value: book_consultation
      - label: Visit the website
        value: visit_website
      - label: Other
        value: other
  - code: will_a_qr
    kind: radio
    required: true
    section_name: Call to Action
    section_order: 4
    section_field_order: 1
    question: Will a QR code be included?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: url_should_qr
    kind: text
    required: false
    section_name: Call to Action
    section_order: 4
    section_field_order: 2
    question: What URL should the QR code link to?
    hint: Only ask this if the client said yes to including a QR code.
  - code: any_market_reports
    kind: file
    required: false
    section_name: Design Direction
    section_order: 5
    section_field_order: 0
    question: Any market reports or publications you'd like us to reference?
    hint: 'Examples: competitor reports, industry reports, previous editions. Upload
      reference designs, up to 3.'
  - code: describe_report_design
    kind: radio
    required: true
    section_name: Design Direction
    section_order: 5
    section_field_order: 1
    question: Describe the report design style.
    options:
      - label: Corporate
        value: corporate
      - label: Premium Real Estate
        value: premium_real_estate
      - label: Editorial
        value: editorial
      - label: Investor-Focused
        value: investor_focused
      - label: Data-Driven
        value: data_driven
      - label: Modern Minimal
        value: modern_minimal
      - label: Other
        value: other
  - code: will_this_report
    kind: radio
    required: true
    section_name: Technical Requirements
    section_order: 6
    section_field_order: 0
    question: Will this report be printed, viewed digitally, or both?
    options:
      - label: Print Only
        value: print_only
      - label: Digital Only
        value: digital_only
      - label: Both
        value: both
  - code: any_other_technical
    kind: text
    required: false
    section_name: Technical Requirements
    section_order: 6
    section_field_order: 1
    question: Any other technical or production requirements?
    hint: 'Examples: interactive PDF, print-ready PDF, LinkedIn carousel format, custom
      page size. Leave blank if unsure.'
