template_key: real_estate_open_home_signboard
template_label: Open Home Signboard
vertical: realestate
template_name_match:
  - signboard
  - sign board
  - open home sign
fields:
  - code: promoted_item
    kind: text
    required: true
    section_name: Open Home Information
    section_order: 0
    section_field_order: 0
    question: What property is this signboard promoting? Give the property address.
  - code: launch_date_time
    kind: text
    required: false
    section_name: Post Purpose & Product
    section_field_order: 2
    question: When is this going to be launched? (Date and time)
    hint: Provide the exact or approximate launch date and time.
    show_if:
      field: post_purpose
      in:
        - new_menu_item
        - seasonal_special
        - combo_meal_offer
        - event_promotion
        - product_launch
        - new_collection
        - limited_edition
        - flash_sale
  - code: content_structure
    kind: radio
    required: true
    section_name: Open Home Information
    section_order: 0
    section_field_order: 1
    question: What type of property is it?
    options:
      - label: House
        value: house
      - label: Apartment
        value: apartment
      - label: Townhouse
        value: townhouse
      - label: Villa
        value: villa
      - label: Land
        value: land
      - label: Commercial Property
        value: commercial
      - label: Other
        value: other
  - code: post_purpose
    kind: radio
    required: true
    section_name: Open Home Information
    section_order: 0
    section_field_order: 2
    question: What is the purpose of the signboard?
    options:
      - label: Open Home
        value: open_home
      - label: Auction
        value: auction
      - label: New Listing
        value: new_listing
      - label: Sold Property
        value: sold_property
      - label: Directional Sign
        value: directional_sign
      - label: Custom
        value: custom
  - code: date_and_time
    kind: text
    required: false
    section_name: Open Home Information
    section_order: 0
    section_field_order: 3
    question: What date and time is the open home?
    hint: "Required if promoting an inspection \u2014 only ask this if the purpose\
      \ above is Open Home or Auction."
  - code: content_structure_1
    kind: radio
    required: true
    section_name: Signboard Type
    section_order: 1
    section_field_order: 0
    question: What type of signboard is required?
    options:
      - label: A-Frame Sign
        value: a_frame
      - label: Corflute Sign
        value: corflute
      - label: Directional Sign
        value: directional
      - label: Open Home Pointer Sign
        value: pointer_sign
      - label: Pull-Up Banner
        value: pull_up_banner
      - label: Fence Sign
        value: fence_sign
      - label: Custom Size
        value: custom
  - code: dimensions
    kind: text
    required: true
    section_name: Signboard Type
    section_order: 1
    section_field_order: 1
    question: What are the dimensions?
    hint: Provide printer specifications if available.
  - code: property_details_should
    kind: text
    required: true
    section_name: Property Content
    section_order: 2
    section_field_order: 0
    question: What property details should appear?
    hint: 'Examples: bedrooms, bathrooms, car spaces, land size, price guide, auction
      date.'
  - code: key_message_should
    kind: text
    required: true
    section_name: Property Content
    section_order: 2
    section_field_order: 1
    question: What key message should the signboard communicate?
    hint: 'Examples: "Open Home Today", "Auction This Saturday", "New Listing", "Luxury
      Waterfront Living", "Contact Agent".'
  - code: have_property_photography
    kind: file
    required: true
    section_name: Images & Assets
    section_order: 3
    section_field_order: 0
    question: Do you have property photography to include? Please upload the images.
    hint: Minimum 300 DPI at final print size.
  - code: have_any_additional
    kind: checkbox
    required: true
    section_name: Images & Assets
    section_order: 3
    section_field_order: 1
    question: Do you have any additional assets?
    options:
      - label: Agent Photo
        value: agent_photo
      - label: Floor Plan
        value: floor_plan
      - label: Agency Awards
        value: agency_awards
      - label: QR Code
        value: qr_code
      - label: Property Logo
        value: property_logo
      - label: Other
        value: other
      - label: None
        value: none
  - code: which_agent_details
    kind: text
    required: true
    section_name: Agent Information
    section_order: 4
    section_field_order: 0
    question: Which agent details should appear? Give the agent name, phone number,
      email, and website.
  - code: primary_call_to
    kind: radio
    required: true
    section_name: Agent Information
    section_order: 4
    section_field_order: 1
    question: What is the primary call to action?
    options:
      - label: Inspect Today
        value: inspect_today
      - label: Contact Agent
        value: contact_agent
      - label: Register for Auction
        value: register_auction
      - label: Scan for Property Details
        value: scan_for_details
      - label: Book a Viewing
        value: book_viewing
      - label: Other
        value: other
  - code: will_a_qr
    kind: radio
    required: true
    section_name: Agent Information
    section_order: 4
    section_field_order: 2
    question: Will a QR code be included?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: url_should_qr
    kind: text
    required: false
    section_name: Agent Information
    section_order: 4
    section_field_order: 3
    question: What URL should the QR code link to?
    hint: 'Only ask this if the client said yes to including a QR code. Examples:
      property listing, virtual tour, agency website, inspection registration.'
  - code: does_signboard_need
    kind: radio
    required: true
    section_name: Directional Requirements
    section_order: 5
    section_field_order: 0
    question: Does the signboard need directional arrows?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: direction_should_be
    kind: checkbox
    required: false
    section_name: Directional Requirements
    section_order: 5
    section_field_order: 1
    question: What direction should be shown?
    hint: "One of the most commonly missed questions for open home signage \u2014\
      \ only ask this if the client said yes to directional arrows above."
    options:
      - label: Left
        value: left
      - label: Right
        value: right
      - label: Straight Ahead
        value: straight_ahead
      - label: Multiple Directions
        value: multiple_directions
  - code: inspiration_type
    kind: file
    required: false
    section_name: Design Direction
    section_order: 6
    section_field_order: 0
    question: Any reference signboards or inspiration?
    hint: Competitors, previous campaigns, or styles you admire. Upload references,
      up to 3.
  - code: visual_style
    kind: radio
    required: true
    section_name: Design Direction
    section_order: 6
    section_field_order: 1
    question: Describe the visual style you'd like.
    options:
      - label: Premium Real Estate
        value: premium_real_estate
      - label: Luxury
        value: luxury
      - label: Minimal
        value: minimal
      - label: Corporate
        value: corporate
      - label: High Visibility
        value: high_visibility
      - label: Modern
        value: modern
      - label: Other
        value: other
  - code: will_signboard_be
    kind: radio
    required: true
    section_name: Production Requirements
    section_order: 7
    section_field_order: 0
    question: Will the signboard be used indoors or outdoors?
    hint: This affects readability and production specifications.
    options:
      - label: Indoor
        value: indoor
      - label: Outdoor
        value: outdoor
      - label: Both
        value: both
