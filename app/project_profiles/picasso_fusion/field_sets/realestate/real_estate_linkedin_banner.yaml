template_key: real_estate_linkedin_banner
template_label: LinkedIn Banner
vertical: realestate
template_name_match:
- linkedin banner
- linkedin cover
fields:
- code: LB1
  kind: radio
  required: true
  section_name: Banner Overview
  section_order: 0
  section_field_order: 0
  question: Is this banner for a personal profile or a company page?
  options:
  - label: Personal LinkedIn Banner
    value: personal
  - label: Company LinkedIn Banner
    value: company
- code: LB2
  kind: checkbox
  required: true
  section_name: Banner Overview
  section_order: 0
  section_field_order: 1
  question: What is the primary goal of this banner?
  options:
  - label: Personal Branding
    value: personal_branding
  - label: Thought Leadership
    value: thought_leadership
  - label: Company Awareness
    value: company_awareness
  - label: Lead Generation
    value: lead_generation
  - label: Recruiting
    value: recruiting
  - label: Product Promotion
    value: product_promotion
  - label: Event Promotion
    value: event_promotion
  - label: Other
    value: other
- code: LB3
  kind: checkbox
  required: true
  section_name: Banner Overview
  section_order: 0
  section_field_order: 2
  question: Who is the target audience?
  hint: This is one of the most important questions.
  options:
  - label: Business Owners
    value: business_owners
  - label: Executives
    value: executives
  - label: Recruiters
    value: recruiters
  - label: Job Seekers
    value: job_seekers
  - label: Investors
    value: investors
  - label: Enterprise Buyers
    value: enterprise_buyers
  - label: Startups
    value: startups
  - label: General Industry Audience
    value: general_industry
  - label: Other
    value: other
- code: LB4
  kind: text
  required: true
  section_name: Core Message
  section_order: 1
  section_field_order: 0
  question: What is the key message this banner should communicate?
  hint: 'One clear message works best. Examples: "Helping businesses scale with AI",
    "Australia''s trusted property advisors", "Award-winning digital marketing agency",
    "Building the future of fintech".'
- code: LB5
  kind: text
  required: true
  section_name: Core Message
  section_order: 1
  section_field_order: 1
  question: What text should appear on the banner?
  hint: 'Examples: tagline, service list, company slogan, credentials, website URL,
    professional title.'
- code: LB6
  kind: file
  required: true
  section_name: Assets
  section_order: 2
  section_field_order: 0
  question: Do you have photography, headshots, product visuals, or brand assets to
    include? Please upload images and assets.
  hint: PNG or JPG preferred.
- code: LB7
  kind: checkbox
  required: true
  section_name: Assets
  section_order: 2
  section_field_order: 1
  question: Should any specific logos, certifications, awards, or achievements be
    featured?
  options:
  - label: Industry Awards
    value: industry_awards
  - label: Partner Badges
    value: partner_badges
  - label: Certifications
    value: certifications
  - label: Company Logos
    value: company_logos
  - label: Other
    value: other
  - label: None
    value: none
- code: LB8
  kind: radio
  required: false
  section_name: Personal Profile Only (Conditional)
  section_order: 3
  section_field_order: 0
  question: What do you want to be known for professionally?
  hint: Only ask this if the banner is for a Personal LinkedIn profile (LB1 = Personal).
  options:
  - label: Real Estate Advisor
    value: real_estate_advisor
  - label: SaaS Founder
    value: saas_founder
  - label: Fractional CMO
    value: fractional_cmo
  - label: Executive Coach
    value: executive_coach
  - label: Business Consultant
    value: business_consultant
  - label: Other
    value: other
- code: LB9
  kind: text
  required: false
  section_name: Company Page Only (Conditional)
  section_order: 4
  section_field_order: 0
  question: What products, services, or capabilities should be highlighted? List the
    most important offerings.
  hint: Only ask this if the banner is for a Company LinkedIn page (LB1 = Company).
- code: LB10
  kind: file
  required: false
  section_name: Design Direction
  section_order: 5
  section_field_order: 0
  question: Any LinkedIn banners or profiles you'd like us to reference?
  hint: Upload references, up to 3.
- code: LB11
  kind: radio
  required: true
  section_name: Design Direction
  section_order: 5
  section_field_order: 1
  question: Describe the visual style you'd like.
  options:
  - label: Corporate
    value: corporate
  - label: Premium
    value: premium
  - label: Minimal
    value: minimal
  - label: Modern
    value: modern
  - label: Technology-Focused
    value: technology_focused
  - label: Luxury
    value: luxury
  - label: Personal Brand
    value: personal_brand
  - label: Other
    value: other
- code: LB12
  kind: text
  required: false
  section_name: Technical Requirements
  section_order: 6
  section_field_order: 0
  question: Any LinkedIn-specific or technical requirements?
  hint: Leave blank if unsure — we'll use LinkedIn-recommended dimensions and safe
    zones.
