template_key: startup_entrepreneur_email_signature
template_label: Email Signature
vertical: startup
template_name_match:
  - email signature
  - signature template
fields:
  - code: this_email_signature
    kind: radio
    required: true
    section_name: Signature Type
    section_order: 0
    section_field_order: 0
    question: Is this email signature for an individual or a company-wide template?
    hint: This determines how flexible the signature needs to be.
    options:
      - label: Individual Signature
        value: individual_signature
      - label: Team Template
        value: team_template
      - label: Company-Wide Template
        value: company_wide_template
  - code: contact_information_should
    kind: checkbox
    required: true
    section_name: Contact & Social
    section_order: 1
    section_field_order: 0
    question: What contact information should appear?
    hint: Only include details recipients should use.
    options:
      - label: Full Name
        value: full_name
      - label: Job Title
        value: job_title
      - label: Department
        value: department
      - label: Phone Number
        value: phone_number
      - label: Mobile Number
        value: mobile_number
      - label: Email Address
        value: email_address
      - label: Website
        value: website
      - label: Office Address
        value: office_address
      - label: Other
        value: other
  - code: should_social_media
    kind: checkbox
    required: true
    section_name: Contact & Social
    section_order: 1
    section_field_order: 1
    question: Should social media links be included?
    hint: Social links can improve credibility and engagement.
    options:
      - label: LinkedIn
        value: linkedin
      - label: X / Twitter
        value: x_twitter
      - label: Instagram
        value: instagram
      - label: Facebook
        value: facebook
      - label: YouTube
        value: youtube
      - label: TikTok
        value: tiktok
      - label: Other
        value: other
  - code: provide_social_profile
    kind: text
    required: false
    section_name: Contact & Social
    section_order: 1
    section_field_order: 2
    question: Provide social profile URLs.
    hint: Please ensure all URLs are correct. Only if you selected social media links
      above.
  - code: want_a_calltoaction
    kind: radio
    required: true
    section_name: Call to Action
    section_order: 2
    section_field_order: 0
    question: Do you want a call-to-action banner or promotional section?
    hint: Email signatures can drive leads, bookings, or awareness.
    options:
      - label: Book a Call
        value: book_a_call
      - label: Visit Website
        value: visit_website
      - label: Download Resource
        value: download_resource
      - label: Event Promotion
        value: event_promotion
      - label: Product Promotion
        value: product_promotion
      - label: No CTA
        value: no_cta
  - code: provide_cta_text
    kind: text
    required: false
    section_name: Call to Action
    section_order: 2
    section_field_order: 1
    question: Provide CTA text and destination URL.
    hint: Only if you selected a CTA option above.
  - code: have_brand_assets
    kind: radio
    required: true
    section_name: Branding & Assets
    section_order: 3
    section_field_order: 0
    question: Do you have brand assets?
    hint: Brand consistency improves trust and recognition.
    options:
      - label: Logo Only
        value: logo_only
      - label: Full Brand Guidelines
        value: full_brand_guidelines
      - label: Existing Signature
        value: existing_signature
      - label: No Assets
        value: no_assets
  - code: upload_logo_and
    kind: file
    required: false
    section_name: Branding & Assets
    section_order: 3
    section_field_order: 1
    question: Upload logo and brand assets.
    hint: SVG or PNG preferred. Only if you have brand assets.
  - code: style_would_prefer
    kind: radio
    required: true
    section_name: Style & People
    section_order: 4
    section_field_order: 0
    question: What style would you prefer?
    hint: Choose a style that matches your brand.
    options:
      - label: Corporate
        value: corporate
      - label: Minimal
        value: minimal
      - label: Modern
        value: modern
      - label: Premium
        value: premium
      - label: Startup
        value: startup
      - label: Creative
        value: creative
      - label: Sales-Focused
        value: sales_focused
  - code: will_employee_headshots
    kind: radio
    required: true
    section_name: Style & People
    section_order: 4
    section_field_order: 1
    question: Will employee headshots be included?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
      - label: Optional
        value: optional
  - code: should_a_legal
    kind: radio
    required: true
    section_name: Legal & Compliance
    section_order: 5
    section_field_order: 0
    question: Should a legal disclaimer or compliance notice be included?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: provide_disclaimer_text
    kind: text
    required: false
    section_name: Legal & Compliance
    section_order: 5
    section_field_order: 1
    question: Provide disclaimer text.
    hint: Only if you said yes above.
    show_if:
      field: should_a_legal
      in:
        - 'yes'
  - code: which_email_platforms
    kind: checkbox
    required: true
    section_name: Platform & Technical
    section_order: 6
    section_field_order: 0
    question: Which email platform(s) will use this signature?
    hint: Rendering differs between platforms.
    options:
      - label: Outlook
        value: outlook
      - label: Gmail
        value: gmail
      - label: Microsoft 365
        value: microsoft_365
      - label: Apple Mail
        value: apple_mail
      - label: Thunderbird
        value: thunderbird
      - label: Multiple Platforms
        value: multiple_platforms
  - code: need_html_email
    kind: radio
    required: true
    section_name: Platform & Technical
    section_order: 6
    section_field_order: 1
    question: Do you need HTML email signature files or design-only output?
    hint: This is probably the most important technical question and is currently
      missing.
    options:
      - label: HTML Signature
        value: html_signature
      - label: Design Mockup Only
        value: design_mockup_only
      - label: Both
        value: both
      - label: Not Sure
        value: not_sure
  - code: inspiration_type
    kind: radio
    required: true
    section_name: References
    section_order: 7
    section_field_order: 0
    question: Any reference signatures or inspiration?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: upload_references
    kind: file
    required: false
    section_name: References
    section_order: 7
    section_field_order: 1
    question: Upload reference signatures, up to 3.
    hint: Only if you said yes to reference signatures above.
    show_if:
      field: inspiration_type
      in:
        - 'yes'
