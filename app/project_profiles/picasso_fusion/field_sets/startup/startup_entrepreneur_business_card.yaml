template_key: startup_entrepreneur_business_card
template_label: Business Card
vertical: startup
template_name_match:
- business card
- namecard
- name card
fields:
- code: BC1
  kind: text
  required: true
  section_name: Card Overview
  section_order: 0
  section_field_order: 0
  question: Who is this business card for?
  hint: "Provide the person's name and job title exactly as it should appear. Examples:\
    \ \"John Smith \u2013 Founder & CEO\", \"Sarah Lee \u2013 Senior Property Consultant\"\
    , \"Michael Chen \u2013 Marketing Director\"."
- code: BC2
  kind: radio
  required: true
  section_name: Card Overview
  section_order: 0
  section_field_order: 1
  question: What is the primary purpose of this business card?
  hint: Different goals require different layouts and information hierarchy.
  options:
  - label: Networking
    value: networking
  - label: Sales & Lead Generation
    value: sales_lead_generation
  - label: Client Meetings
    value: client_meetings
  - label: Corporate Identity
    value: corporate_identity
  - label: Event Distribution
    value: event_distribution
  - label: Personal Branding
    value: personal_branding
- code: BC3
  kind: checkbox
  required: true
  section_name: Card Overview
  section_order: 0
  section_field_order: 2
  question: What contact details should appear?
  hint: Include only information recipients should use.
  options:
  - label: Mobile Number
    value: mobile_number
  - label: Office Number
    value: office_number
  - label: Email Address
    value: email_address
  - label: Website
    value: website
  - label: Office Address
    value: office_address
  - label: LinkedIn Profile
    value: linkedin_profile
  - label: Other
    value: other
- code: BC4
  kind: radio
  required: true
  section_name: QR Code
  section_order: 1
  section_field_order: 0
  question: Should a QR code be included?
  hint: QR codes can improve engagement and lead generation.
  options:
  - label: Website
    value: website
  - label: Digital Business Card (vCard)
    value: digital_business_card_vcard
  - label: LinkedIn Profile
    value: linkedin_profile
  - label: Booking Page
    value: booking_page
  - label: Portfolio
    value: portfolio
  - label: No QR Code
    value: no_qr_code
- code: BC5
  kind: text
  required: false
  section_name: QR Code
  section_order: 1
  section_field_order: 1
  question: Provide QR code destination URL.
  hint: Please verify the link before production. Only if you selected a QR code option
    above.
- code: BC6
  kind: radio
  required: true
  section_name: Branding & Assets
  section_order: 2
  section_field_order: 0
  question: Do you have brand assets?
  hint: Consistent branding creates a professional impression.
  options:
  - label: Full Brand Guidelines
    value: full_brand_guidelines
  - label: Logo Only
    value: logo_only
  - label: Existing Business Card
    value: existing_business_card
  - label: No Assets Available
    value: no_assets_available
- code: BC7
  kind: file
  required: false
  section_name: Branding & Assets
  section_order: 2
  section_field_order: 1
  question: Upload logo, brand guide, and visual assets.
  hint: Vector files (SVG, AI, EPS, PDF) preferred. Only if you have brand assets.
- code: BC8
  kind: radio
  required: true
  section_name: Layout
  section_order: 3
  section_field_order: 0
  question: Single-sided or double-sided card?
  hint: Double-sided cards provide additional space for branding and QR codes.
  options:
  - label: Single-Sided
    value: single_sided
  - label: Double-Sided
    value: double_sided
- code: BC9
  kind: checkbox
  required: false
  section_name: Layout
  section_order: 3
  section_field_order: 1
  question: Should any additional information appear?
  hint: Only include information that adds value.
  options:
  - label: Tagline
    value: tagline
  - label: Certifications
    value: certifications
  - label: Awards
    value: awards
  - label: Service Categories
    value: service_categories
  - label: Social Media Handles
    value: social_media_handles
  - label: Appointment Booking Link
    value: appointment_booking_link
  - label: Other
    value: other
  - label: None
    value: none
- code: BC10
  kind: radio
  required: true
  section_name: Layout
  section_order: 3
  section_field_order: 2
  question: What card orientation do you prefer?
  hint: This affects layout significantly and is often forgotten.
  options:
  - label: Horizontal
    value: horizontal
  - label: Vertical
    value: vertical
  - label: Square
    value: square
  - label: No Preference
    value: no_preference
- code: BC11
  kind: radio
  required: true
  section_name: Style & References
  section_order: 4
  section_field_order: 0
  question: Preferred card style?
  hint: Match the card to the brand personality.
  options:
  - label: Corporate
    value: corporate
  - label: Minimal
    value: minimal
  - label: Premium
    value: premium
  - label: Luxury
    value: luxury
  - label: Modern
    value: modern
  - label: Creative
    value: creative
  - label: Bold
    value: bold
  - label: Other
    value: other
- code: BC12
  kind: radio
  required: true
  section_name: Style & References
  section_order: 4
  section_field_order: 1
  question: Any reference business cards or inspiration?
  options:
  - label: 'Yes'
    value: 'yes'
  - label: 'No'
    value: 'no'
- code: BC13
  kind: file
  required: false
  section_name: Style & References
  section_order: 4
  section_field_order: 2
  question: Upload reference cards, up to 3.
  hint: Only if you said yes to reference business cards above.
  show_if:
    field: BC12
    in:
    - 'yes'
- code: BC14
  kind: checkbox
  required: false
  section_name: Print & Production
  section_order: 5
  section_field_order: 0
  question: Any print-specific requirements?
  hint: Leave blank if unsure.
  options:
  - label: Matte Finish
    value: matte_finish
  - label: Soft-Touch Lamination
    value: soft_touch_lamination
  - label: Spot UV
    value: spot_uv
  - label: Foil Stamping
    value: foil_stamping
  - label: Embossing
    value: embossing
  - label: Rounded Corners
    value: rounded_corners
  - label: Recycled Stock
    value: recycled_stock
  - label: Other
    value: other
- code: BC15
  kind: radio
  required: true
  section_name: Print & Production
  section_order: 5
  section_field_order: 1
  question: Will multiple employees use this design template?
  hint: This determines whether the designer should create a reusable business card
    system.
  options:
  - label: 'Yes'
    value: 'yes'
  - label: 'No'
    value: 'no'
