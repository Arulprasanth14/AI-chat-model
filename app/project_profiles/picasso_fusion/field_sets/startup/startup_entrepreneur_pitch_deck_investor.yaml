template_key: startup_entrepreneur_pitch_deck_investor
template_label: "Pitch Deck \u2014 Investor"
vertical: startup
template_name_match:
  - pitch deck
  - investor deck
  - pitch / investor deck
  - investor pitch
fields:
  - code: stage_fundraising_this
    kind: radio
    required: true
    section_name: Deck Overview
    section_order: 0
    section_field_order: 0
    question: What stage of fundraising is this deck for?
    hint: Investor expectations vary by stage.
    options:
      - label: Pre-Seed
        value: pre_seed
      - label: Seed
        value: seed
      - label: Series A
        value: series_a
      - label: Series B+
        value: series_b_plus
      - label: Angel Investment
        value: angel_investment
      - label: Accelerator / Incubator
        value: accelerator_incubator
      - label: Other
        value: other
  - code: company_product_or
    kind: text
    required: true
    section_name: Deck Overview
    section_order: 0
    section_field_order: 1
    question: What company, product, or startup are we presenting?
    hint: Brief overview of what the business does and who it serves.
  - code: who_target_audience
    kind: checkbox
    required: true
    section_name: Deck Overview
    section_order: 0
    section_field_order: 2
    question: Who is the target audience for this deck?
    hint: Different investors expect different information.
    options:
      - label: Angel Investors
        value: angel_investors
      - label: Venture Capital Firms
        value: vc_firms
      - label: Accelerators
        value: accelerators
      - label: Strategic Partners
        value: strategic_partners
      - label: Family Offices
        value: family_offices
      - label: Corporate Investors
        value: corporate_investors
      - label: Other
        value: other
  - code: problem_solving
    kind: text
    required: true
    section_name: Business Fundamentals
    section_order: 1
    section_field_order: 0
    question: What problem are you solving?
    hint: Investors invest in meaningful problems.
  - code: your_solution
    kind: text
    required: true
    section_name: Business Fundamentals
    section_order: 1
    section_field_order: 1
    question: What is your solution?
    hint: Clearly explain how your product or service solves the problem.
  - code: your_business_model
    kind: checkbox
    required: true
    section_name: Business Fundamentals
    section_order: 1
    section_field_order: 2
    question: What is your business model? How does the company make money?
    options:
      - label: SaaS Subscription
        value: saas_subscription
      - label: Marketplace
        value: marketplace
      - label: Transaction Fees
        value: transaction_fees
      - label: Licensing
        value: licensing
      - label: Services
        value: services
      - label: E-commerce
        value: ecommerce
      - label: Other
        value: other
  - code: market_opportunity_should
    kind: text
    required: true
    section_name: Market & Competition
    section_order: 2
    section_field_order: 0
    question: What market opportunity should be highlighted?
    hint: Market size, industry opportunity, growth trends, TAM/SAM/SOM, etc.
  - code: who_your_key
    kind: text
    required: true
    section_name: Market & Competition
    section_order: 2
    section_field_order: 1
    question: Who are your key competitors and what makes you different?
    hint: Differentiation is one of the most important investor considerations.
  - code: traction_or_proof
    kind: checkbox
    required: true
    section_name: Traction & Funding Ask
    section_order: 3
    section_field_order: 0
    question: What traction or proof do you have?
    hint: Metrics build credibility.
    options:
      - label: Revenue
        value: revenue
      - label: Users
        value: users
      - label: Growth Rate
        value: growth_rate
      - label: Customers
        value: customers
      - label: Partnerships
        value: partnerships
      - label: Retention
        value: retention
      - label: Waitlist
        value: waitlist
      - label: Other
        value: other
  - code: much_funding_seeking
    kind: text
    required: true
    section_name: Traction & Funding Ask
    section_order: 3
    section_field_order: 1
    question: How much funding are you seeking, and by when do you need it?
  - code: will_funds_primarily
    kind: checkbox
    required: true
    section_name: Traction & Funding Ask
    section_order: 3
    section_field_order: 2
    question: What will the funds primarily be used for?
    options:
      - label: Product Development
        value: product_development
      - label: Hiring
        value: hiring
      - label: Marketing
        value: marketing
      - label: Expansion
        value: expansion
      - label: Operations
        value: operations
      - label: Other
        value: other
  - code: already_have_content
    kind: radio
    required: true
    section_name: Existing Content
    section_order: 4
    section_field_order: 0
    question: Do you already have content, notes, or an existing deck?
    options:
      - label: Yes, complete deck
        value: complete_deck
      - label: Partial content available
        value: partial_content
      - label: Need help structuring content
        value: need_structuring
      - label: Need help creating content
        value: need_creation
  - code: upload_existing_deck
    kind: file
    required: false
    section_name: Existing Content
    section_order: 4
    section_field_order: 1
    question: Upload existing deck, content, or supporting documents.
    hint: 'Accepted formats: PPTX, PDF, DOCX, Google Slides export. Only if you have
      existing content.'
  - code: have_branding_and
    kind: radio
    required: true
    section_name: Branding & Assets
    section_order: 5
    section_field_order: 0
    question: Do you have branding and assets?
    hint: Consistent branding improves investor perception.
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
      - label: Partial
        value: partial
  - code: upload_logos_screenshots
    kind: file
    required: false
    section_name: Branding & Assets
    section_order: 5
    section_field_order: 1
    question: Upload logos, screenshots, product images, and brand assets.
    hint: PNG, SVG, JPG preferred. Only if you have branding assets.
  - code: will_this_deck
    kind: radio
    required: true
    section_name: Delivery & Presentation Style
    section_order: 6
    section_field_order: 0
    question: Will this deck be presented live or sent to investors for review?
    hint: This affects slide density and storytelling style.
    options:
      - label: Live Presentation
        value: live_presentation
      - label: Send-Ahead Deck
        value: send_ahead_deck
      - label: Both
        value: both
  - code: have_any_reference
    kind: radio
    required: true
    section_name: Delivery & Presentation Style
    section_order: 6
    section_field_order: 1
    question: Do you have any reference pitch decks or presentation styles?
    hint: Competitor decks, successful startup decks, or visual styles you admire.
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: upload_references
    kind: file
    required: false
    section_name: Delivery & Presentation Style
    section_order: 6
    section_field_order: 2
    question: Upload reference decks, up to 3.
    hint: Only if you said yes to reference decks above.
    show_if:
      field: have_any_reference
      in:
        - 'yes'
  - code: describe_presentation_style
    kind: radio
    required: true
    section_name: Delivery & Presentation Style
    section_order: 6
    section_field_order: 3
    question: Describe the presentation style you'd like.
    options:
      - label: Investor-Grade
        value: investor_grade
      - label: Minimal
        value: minimal
      - label: Premium
        value: premium
      - label: SaaS
        value: saas
      - label: Data-Driven
        value: data_driven
      - label: Bold Startup
        value: bold_startup
      - label: Corporate
        value: corporate
      - label: Other
        value: other
