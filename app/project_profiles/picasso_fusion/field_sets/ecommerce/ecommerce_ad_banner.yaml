template_key: ecommerce_ad_banner
template_label: Ad Banner
vertical: ecommerce
template_name_match:
- ad banner
- banner ad
- display banner
- display ad
fields:
- code: AB1
  kind: radio
  required: true
  section_name: Banner Type & Message
  section_order: 0
  section_field_order: 0
  question: What are we creating today?
  hint: Select the banner type.
  options:
  - label: Meta Ad Banner
    value: meta_ad_banner
  - label: Google Display Banner
    value: google_display_banner
  - label: Website Promotional Banner
    value: website_promotional_banner
  - label: Homepage Hero Banner
    value: homepage_hero_banner
  - label: Retargeting Banner
    value: retargeting_banner
  - label: Seasonal Campaign Banner
    value: seasonal_campaign_banner
  - label: Product Launch Banner
    value: product_launch_banner
  - label: Sale / Offer Banner
    value: sale_offer_banner
  - label: Collection Banner
    value: collection_banner
  - label: Brand Awareness Banner
    value: brand_awareness_banner
  - label: Other
    value: other
- code: AB2
  kind: text
  required: true
  section_name: Banner Type & Message
  section_order: 0
  section_field_order: 1
  question: What are we promoting?
  hint: 'Provide the key product or service information: Product/Service Name, Category,
    Price (Optional), Key Features/Benefits.'
- code: AB3
  kind: text
  required: true
  section_name: Banner Type & Message
  section_order: 0
  section_field_order: 2
  question: What's the ONE message customers should remember?
  hint: 'Describe the biggest reason someone should click. Example: "Save up to 50%
    this weekend.", "Premium skincare made for sensitive skin.", "Free shipping on
    all orders."'
- code: AB4
  kind: checkbox
  required: true
  section_name: Goal & Audience
  section_order: 1
  section_field_order: 0
  question: What's the goal of this campaign?
  options:
  - label: Increase Sales
    value: increase_sales
  - label: Website Traffic
    value: website_traffic
  - label: Lead Generation
    value: lead_generation
  - label: Product Launch
    value: product_launch
  - label: Promote an Offer
    value: promote_an_offer
  - label: Brand Awareness
    value: brand_awareness
  - label: Retarget Existing Customers
    value: retarget_existing_customers
  - label: Increase App Downloads
    value: increase_app_downloads
  - label: Other
    value: other
- code: AB5
  kind: text
  required: true
  section_name: Goal & Audience
  section_order: 1
  section_field_order: 1
  question: Who is this campaign for?
  hint: Describe your target audience.
- code: AB6
  kind: radio
  required: true
  section_name: Offer
  section_order: 2
  section_field_order: 0
  question: Are you running an offer?
  options:
  - label: No Offer
    value: no_offer
  - label: Percentage Discount
    value: percentage_discount
  - label: Flat Discount
    value: flat_discount
  - label: Buy One Get One
    value: buy_one_get_one
  - label: Bundle Offer
    value: bundle_offer
  - label: Free Shipping
    value: free_shipping
  - label: Free Gift
    value: free_gift
  - label: Limited-Time Offer
    value: limited_time_offer
  - label: Other
    value: other
- code: AB7
  kind: text
  required: false
  section_name: Offer
  section_order: 2
  section_field_order: 1
  question: Provide the offer details, start & end date, and terms & conditions.
  hint: Only if you are running an offer.
  show_if:
    field: AB6
    not_in:
    - no_offer
- code: AB8
  kind: radio
  required: true
  section_name: Copy
  section_order: 3
  section_field_order: 0
  question: Do you already have the copy?
  options:
  - label: Final Copy Ready
    value: final_copy_ready
  - label: Rough Points
    value: rough_points
  - label: Need Copywriting Support
    value: need_copywriting_support
- code: AB9
  kind: text
  required: false
  section_name: Copy
  section_order: 3
  section_field_order: 1
  question: Provide your copy or rough points.
  hint: Only if you have final copy ready or rough points.
- code: AB10
  kind: checkbox
  required: false
  section_name: Design Requirements
  section_order: 4
  section_field_order: 0
  question: Is there anything that must appear?
  hint: Select all that apply.
  options:
  - label: Product Name
    value: product_name
  - label: Product Price
    value: product_price
  - label: Discount
    value: discount
  - label: Brand Logo
    value: brand_logo
  - label: Website
    value: website
  - label: Promo Code
    value: promo_code
  - label: CTA Button
    value: cta_button
  - label: Product Rating
    value: product_rating
  - label: Trust Badge
    value: trust_badge
  - label: QR Code
    value: qr_code
  - label: Other
    value: other
- code: AB11
  kind: checkbox
  required: true
  section_name: Images & Assets
  section_order: 5
  section_field_order: 0
  question: Do you have images or assets?
  options:
  - label: I'll Upload Product Photos
    value: ill_upload_product_photos
  - label: I'll Upload Lifestyle Images
    value: ill_upload_lifestyle_images
  - label: I'll Upload Graphics
    value: ill_upload_graphics
  - label: Use Stock Images
    value: use_stock_images
  - label: Use Only Brand Assets
    value: use_only_brand_assets
  - label: Designer Can Recommend
    value: designer_can_recommend
- code: AB12
  kind: file
  required: false
  section_name: Images & Assets
  section_order: 5
  section_field_order: 1
  question: Upload your files.
  hint: Upload product photos, logos, graphics, or supporting assets. For best results,
    use high-resolution images (1200px or larger).
  show_if:
    field: AB11
    in:
    - ill_upload_product_photos
    - ill_upload_lifestyle_images
    - ill_upload_graphics
- code: AB13
  kind: radio
  required: true
  section_name: Brand Assets
  section_order: 6
  section_field_order: 0
  question: Would you like us to follow your existing brand identity?
