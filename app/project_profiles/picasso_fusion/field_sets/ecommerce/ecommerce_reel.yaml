fields:
- code: RL1
  kind: radio
  required: true
  section_name: Reel Purpose & Product
  section_order: 0
  section_field_order: 0
  question: What are we creating today?
  hint: Select the purpose of this Reel.
  options:
  - label: Product Launch
    value: product_launch
  - label: Product Showcase
    value: product_showcase
  - label: New Arrival
    value: new_arrival
  - label: Best Seller
    value: best_seller
  - label: Product Demonstration
    value: product_demonstration
  - label: Unboxing
    value: unboxing
  - label: How to Use
    value: how_to_use
  - label: Customer Review
    value: customer_review
  - label: Before & After
    value: before_after
  - label: Collection Launch
    value: collection_launch
  - label: Offer / Sale
    value: offer_sale
  - label: Seasonal Campaign
    value: seasonal_campaign
  - label: Brand Awareness
    value: brand_awareness
  - label: Other
    value: other
- code: RL2
  kind: text
  required: true
  section_name: Reel Purpose & Product
  section_order: 0
  section_field_order: 1
  question: Which product are we featuring?
  hint: 'Provide the key product details: Product Name, Category, Price (Optional),
    Key Features/Benefits, Available Colours/Sizes/Variants (Optional).'
- code: RL3
  kind: text
  required: true
  section_name: Reel Purpose & Product
  section_order: 0
  section_field_order: 2
  question: What's the ONE message customers should remember?
  hint: 'Describe the biggest reason someone should buy this product. Example: "Keeps
    drinks cold for 24 hours.", "Premium leather built to last.", "Designed for everyday
    comfort."'
- code: RL4
  kind: checkbox
  required: true
  section_name: Goal & Audience
  section_order: 1
  section_field_order: 0
  question: What's the goal of this Reel?
  options:
  - label: Increase Sales
    value: increase_sales
  - label: Launch a Product
    value: launch_a_product
  - label: Promote an Offer
    value: promote_an_offer
  - label: Drive Website Traffic
    value: drive_website_traffic
  - label: Build Brand Awareness
    value: build_brand_awareness
  - label: Increase Followers
    value: increase_followers
  - label: Generate Enquiries
    value: generate_enquiries
  - label: Other
    value: other
- code: RL5
  kind: text
  required: true
  section_name: Goal & Audience
  section_order: 1
  section_field_order: 1
  question: Who is this product for?
  hint: Describe your ideal customer.
- code: RL6
  kind: radio
  required: true
  section_name: Offer
  section_order: 2
  section_field_order: 0
  question: Are you running an offer?
  options:
  - label: No Offer
    value: no_offer
  - label: Discount
    value: discount
  - label: Buy One Get One
    value: buy_one_get_one
  - label: Bundle Offer
    value: bundle_offer
  - label: Free Shipping
    value: free_shipping
  - label: Limited-Time Offer
    value: limited_time_offer
  - label: Other
    value: other
- code: RL7
  kind: text
  required: false
  section_name: Offer
  section_order: 2
  section_field_order: 1
  question: Provide the offer details, start & end date, and terms & conditions.
  hint: Only if you are running an offer.
  show_if:
    field: RL6
    not_in:
    - no_offer
- code: RL8
  kind: checkbox
  required: true
  section_name: Footage & Key Shots
  section_order: 3
  section_field_order: 0
  question: What footage do you have?
  options:
  - label: I'll Upload Product Videos
    value: ill_upload_product_videos
  - label: I'll Upload Lifestyle Videos
    value: ill_upload_lifestyle_videos
  - label: I Have Both Videos & Photos
    value: i_have_both_videos_photos
  - label: Share via Google Drive
    value: share_via_google_drive
  - label: Use Stock Footage
    value: use_stock_footage
  - label: Designer Can Suggest
    value: designer_can_suggest
- code: RL9
  kind: file
  required: false
  section_name: Footage & Key Shots
  section_order: 3
  section_field_order: 1
  question: Upload your files.
  hint: 'Upload product videos, photos, logos, packaging, or supporting assets. Preferred
    format: Vertical (9:16), MP4/MOV, 1080p or higher.'
  show_if:
    field: RL8
    in:
    - ill_upload_product_videos
    - ill_upload_lifestyle_videos
- code: RL10
  kind: text
  required: false
  section_name: Footage & Key Shots
  section_order: 3
  section_field_order: 2
  question: Are there any shots that must be included?
  hint: 'Example: Product close-up, Packaging, Unboxing, Product in use, Feature demonstration,
