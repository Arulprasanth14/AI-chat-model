- code: CR2
  kind: text
  required: true
  section_name: Carousel Purpose & Product
  section_order: 0
  section_field_order: 1
  question: Which product(s) are we featuring?
  hint: 'Provide the key product information: Product Name(s), Category, Price (Optional),
    Key Features/Benefits, Colours/Sizes/Variants (Optional).'
- code: CR3
  kind: text
  required: true
  section_name: Carousel Purpose & Product
  section_order: 0
  section_field_order: 2
  question: What's the ONE message customers should remember?
  hint: 'Describe the biggest reason someone should buy these products. Example: "Designed
    for all-day comfort.", "Premium quality at an everyday price.", "The perfect gift
    for every occasion."'
