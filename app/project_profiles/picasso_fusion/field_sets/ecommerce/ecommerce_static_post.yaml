template_key: ecommerce_static_post
template_label: Static Post
vertical: ecommerce
template_name_match:
- static post
- static post set
- social media post
- post set
fields:
- code: SP1
  kind: radio
  required: true
  section_name: Post Purpose & Product
  section_order: 0
  section_field_order: 0
  question: What are we creating today?
  hint: Select the purpose of this post.
  options:
  - label: Product Launch
    value: product_launch
  - label: Product Promotion
    value: product_promotion
  - label: New Arrival
    value: new_arrival
  - label: Best Seller
    value: best_seller
  - label: Limited-Time Offer
    value: limited_time_offer
  - label: Seasonal Campaign
    value: seasonal_campaign
  - label: Collection Showcase
    value: collection_showcase
  - label: Product Benefits
    value: product_benefits
  - label: Customer Review
    value: customer_review
  - label: Brand Awareness
    value: brand_awareness
  - label: Other
    value: other
- code: SP2
  kind: text
  required: true
  section_name: Post Purpose & Product
  section_order: 0
  section_field_order: 1
  question: Which product are we featuring?
  hint: 'Provide the key product details: Product Name, Category, Price (Optional),
    Key Benefits/Features, Available Colours, Sizes or Variants (Optional).'
- code: SP3
  kind: text
  required: true
  section_name: Post Purpose & Product
  section_order: 0
  section_field_order: 2
  question: What's the one message customers should remember?
  hint: 'Describe the biggest reason someone should buy this product. Example: "Ultra-light
    running shoes designed for all-day comfort.", "Organic skincare made for sensitive
    skin."'
- code: SP4
  kind: checkbox
  required: true
  section_name: Goal & Audience
  section_order: 1
  section_field_order: 0
  question: What's the goal of this post?
  options:
  - label: Increase Sales
    value: increase_sales
  - label: Drive Website Traffic
    value: drive_website_traffic
  - label: Promote an Offer
    value: promote_an_offer
  - label: Launch a New Product
    value: launch_a_new_product
  - label: Build Brand Awareness
    value: build_brand_awareness
  - label: Collect Enquiries
    value: collect_enquiries
  - label: Grow Followers
    value: grow_followers
  - label: Other
    value: other
- code: SP5
  kind: text
  required: true
  section_name: Goal & Audience
  section_order: 1
  section_field_order: 1
  question: Who is this product for?
  hint: Describe your ideal customer.
- code: SP6
  kind: radio
  required: true
  section_name: Offer
  section_order: 2
  section_field_order: 0
  question: Are you running an offer?
  options:
  - label: No Offer
    value: no_offer
  - label: Discount
    value: discount
  - label: Buy One Get One
    value: buy_one_get_one
  - label: Bundle Offer
    value: bundle_offer
  - label: Free Shipping
    value: free_shipping
  - label: Limited-Time Offer
    value: limited_time_offer
  - label: Other
    value: other
- code: SP7
  kind: text
  required: false
  section_name: Offer
  section_order: 2
  section_field_order: 1
  question: Provide the offer details, start & end date, and terms & conditions.
  hint: Only if you are running an offer.
  show_if:
    field: SP6
    not_in:
    - no_offer
- code: SP8
  kind: radio
  required: true
  section_name: Copy
  section_order: 3
  section_field_order: 0
  question: Do you already have the copy?
  options:
  - label: Final Copy Ready
    value: final_copy_ready
  - label: Rough Points
    value: rough_points
  - label: Need Copywriting Support
    value: need_copywriting_support
- code: SP9
  kind: text
  required: false
  section_name: Copy
  section_order: 3
  section_field_order: 1
  question: Provide your copy or rough points.
  hint: Only if you have final copy ready or rough points.
- code: SP10
  kind: checkbox
  required: false
  section_name: Design Requirements
  section_order: 4
  section_field_order: 0
  question: Is there anything that must appear?
  hint: Select all that apply.
  options:
  - label: Product Name
    value: product_name
  - label: Product Price
    value: product_price
  - label: Discount
    value: discount
  - label: Logo
    value: logo
  - label: Website
    value: website
  - label: QR Code
    value: qr_code
  - label: Promo Code
    value: promo_code
  - label: Social Media Handle
    value: social_media_handle
  - label: Product Rating
    value: product_rating
  - label: Other
    value: other
- code: SP11
  kind: checkbox
  required: true
  section_name: Images & Assets
  section_order: 5
  section_field_order: 0
  question: Do you have product photos?
  options:
  - label: I'll Upload Product Photos
    value: ill_upload_product_photos
  - label: I'll Upload Lifestyle Photos
    value: ill_upload_lifestyle_photos
  - label: I'll Upload Both
    value: ill_upload_both
  - label: Use Stock Lifestyle Images
    value: use_stock_lifestyle_images
  - label: Use Only Brand Assets
    value: use_only_brand_assets
  - label: Designer Can Suggest
    value: designer_can_suggest
- code: SP12
  kind: file
  required: false
  section_name: Images & Assets
  section_order: 5
  section_field_order: 1
  question: Upload your files.
  hint: Upload product images, logos, packaging, or supporting assets.
  show_if:
    field: SP11
    in:
    - ill_upload_product_photos
    - ill_upload_lifestyle_photos
    - ill_upload_both
- code: SP13
  kind: radio
  required: true
  section_name: Brand Assets
  section_order: 6
  section_field_order: 0
  question: Would you like us to follow your existing brand identity?
  hint: Brand Assets & Guidelines.
  options:
  - label: Use My Saved Brand Kit
    value: use_my_saved_brand_kit
  - label: Upload Brand Guidelines
    value: upload_brand_guidelines
  - label: Upload Logo & Assets
    value: upload_logo_assets
  - label: Customize This Project
    value: customize_this_project
- code: SP14
  kind: checkbox
  required: false
  section_name: Brand Assets
  section_order: 6
  section_field_order: 1
  question: What should we customize?
  hint: Only if you selected "Customize This Project" above.
  options:
  - label: Brand Colors
    value: brand_colors
  - label: Brand Fonts
    value: brand_fonts
  - label: Additional Instructions
    value: additional_instructions
  show_if:
    field: SP14
    in:
    - customize_this_project
- code: SP15
  kind: text
  required: false
  section_name: Brand Assets
  section_order: 6
  section_field_order: 2
  question: Provide any additional brand customization details.
  hint: Only if you selected "Customize This Project" above.
  show_if:
    field: SP14
    in:
    - customize_this_project
- code: SP16
  kind: checkbox
  required: true
  section_name: Style & References
  section_order: 7
  section_field_order: 0
  question: What visual style should this post have?
  hint: Choose up to 3.
  options:
  - label: Premium
    value: premium
  - label: Luxury
    value: luxury
  - label: Modern
    value: modern
  - label: Minimal
    value: minimal
  - label: Clean
    value: clean
  - label: Bold
    value: bold
  - label: Lifestyle
    value: lifestyle
  - label: Editorial
    value: editorial
  - label: Vibrant
    value: vibrant
  - label: Elegant
    value: elegant
  - label: High Contrast
    value: high_contrast
  - label: Playful
    value: playful
  - label: Match My Brand Style
    value: match_my_brand_style
- code: SP17
  kind: checkbox
  required: false
  section_name: Style & References
  section_order: 7
  section_field_order: 1
  question: Do you have any inspiration?
  hint: Share examples you like.
  options:
  - label: Instagram Link
    value: instagram_link
  - label: Pinterest Link
    value: pinterest_link
  - label: Website Link
    value: website_link
  - label: Upload Reference Images
    value: upload_reference_images
  - label: Skip
    value: skip
- code: SP18
  kind: text
  required: false
  section_name: Style & References
  section_order: 7
  section_field_order: 2
  question: Provide the reference link(s), or note that you're uploading images.
  hint: Only if you selected a reference option above (not Skip).
  show_if:
    field: SP17
    not_in:
    - skip
