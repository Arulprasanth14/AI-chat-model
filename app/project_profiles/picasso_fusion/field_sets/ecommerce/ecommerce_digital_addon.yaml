template_key: ecommerce_digital_addon
template_label: Digital Asset
vertical: ecommerce
template_name_match:
  - digital design
  - digital add-on
  - digital addon
  - digital brief
  - digital asset
fields:
  - code: post_purpose
    kind: radio
    required: true
    section_name: Digital Asset & Message
    section_order: 0
    section_field_order: 0
    question: What are we creating today?
    hint: Select the digital asset.
    options:
      - label: Website Banner
        value: website_banner
      - label: Homepage Hero Banner
        value: homepage_hero_banner
      - label: Email Header
        value: email_header
      - label: Email Newsletter (EDM)
        value: email_newsletter_edm
      - label: Google Display Ads
        value: google_display_ads
      - label: Meta Ad Creative
        value: meta_ad_creative
      - label: Marketplace Banner
        value: marketplace_banner
      - label: Instagram Story Set
        value: instagram_story_set
      - label: WhatsApp Promotional Graphic
        value: whatsapp_promotional_graphic
      - label: Presentation Deck
        value: presentation_deck
      - label: Digital Menu Board
        value: digital_menu_board
      - label: Website Popup
        value: website_popup
      - label: Other
        value: other
  - code: promoted_item
    kind: text
    required: true
    section_name: Digital Asset & Message
    section_order: 0
    section_field_order: 1
    question: Which product(s) are we promoting?
    hint: 'Provide the key product information: Product Name(s), Category, Price (Optional),
      Key Features/Benefits, Colours/Sizes/Variants (Optional).'
  - code: key_message
    kind: text
    required: true
    section_name: Digital Asset & Message
    section_order: 0
    section_field_order: 2
    question: What's the ONE message customers should remember?
    hint: 'Describe the biggest reason someone should buy. Example: "Premium comfort
      for everyday wear.", "Limited-time festive collection.", "Fast delivery with
      free shipping."'
  - code: post_goal
    kind: checkbox
    required: true
    section_name: Goal & Audience
    section_order: 1
    section_field_order: 0
    question: What's the goal of this digital asset?
    options:
      - label: Increase Sales
        value: increase_sales
      - label: Promote a Product
        value: promote_a_product
      - label: Launch a Collection
        value: launch_a_collection
      - label: Drive Website Traffic
        value: drive_website_traffic
      - label: Generate Leads
        value: generate_leads
      - label: Build Brand Awareness
        value: build_brand_awareness
      - label: Promote an Offer
        value: promote_an_offer
      - label: Retarget Existing Customers
        value: retarget_existing_customers
      - label: Other
        value: other
  - code: target_audience
    kind: text
    required: true
    section_name: Goal & Audience
    section_order: 1
    section_field_order: 1
    question: Who is this for?
    hint: Describe your ideal customer.
  - code: offer_type
    kind: radio
    required: true
    section_name: Offer
    section_order: 2
    section_field_order: 0
    question: Are you running an offer?
    options:
      - label: No Offer
        value: no_offer
      - label: Discount
        value: discount
      - label: Buy One Get One
        value: buy_one_get_one
      - label: Bundle Offer
        value: bundle_offer
      - label: Free Shipping
        value: free_shipping
      - label: Free Gift
        value: free_gift
      - label: Limited-Time Offer
        value: limited_time_offer
      - label: Other
        value: other
  - code: offer_details
    kind: text
    required: false
    section_name: Offer
    section_order: 2
    section_field_order: 1
    question: Provide the offer details, start & end date, and terms & conditions.
    hint: Only if you are running an offer.
    show_if:
      field: offer_type
      not_in:
        - no_offer
  - code: already_have_content
    kind: radio
    required: true
    section_name: Content
    section_order: 3
    section_field_order: 0
    question: Do you already have the content?
    options:
      - label: Final Copy Ready
        value: final_copy_ready
      - label: Rough Points
        value: rough_points
      - label: Need Copywriting Support
        value: need_copywriting_support
  - code: copy_content
    kind: text
    required: false
    section_name: Content
    section_order: 3
    section_field_order: 1
    question: Provide your copy or rough points.
    hint: Only if you have final copy ready or rough points.
  - code: design_requirements
    kind: checkbox
    required: false
    section_name: Design Requirements
    section_order: 4
    section_field_order: 0
    question: Is there anything that must appear?
    hint: Select all that apply.
    options:
      - label: Product Name
        value: product_name
      - label: Product Price
        value: product_price
      - label: Discount
        value: discount
      - label: Logo
        value: logo
      - label: Website
        value: website
      - label: QR Code
        value: qr_code
      - label: Promo Code
        value: promo_code
      - label: CTA Button
        value: cta_button
      - label: Product Rating
        value: product_rating
      - label: Social Media Handles
        value: social_media_handles
      - label: Other
        value: other
  - code: have_images_or
    kind: checkbox
    required: true
    section_name: Images & Assets
    section_order: 5
    section_field_order: 0
    question: Do you have images or assets?
    options:
      - label: I'll Upload Product Photos
        value: ill_upload_product_photos
      - label: I'll Upload Lifestyle Images
        value: ill_upload_lifestyle_images
      - label: I'll Upload Graphics
        value: ill_upload_graphics
      - label: Use Stock Images
        value: use_stock_images
      - label: Use Only Brand Assets
        value: use_only_brand_assets
      - label: Designer Can Suggest
        value: designer_can_suggest
  - code: uploaded_files
    kind: file
    required: false
    section_name: Images & Assets
    section_order: 5
    section_field_order: 1
    question: Upload your files.
    hint: 'Upload product photos, logos, graphics, or supporting assets. Recommended
      formats: PNG, JPG, SVG, PDF.'
    show_if:
      field: have_images_or
      in:
        - ill_upload_product_photos
        - ill_upload_lifestyle_images
        - ill_upload_graphics
  - code: brand_identity_choice
    kind: radio
    required: true
    section_name: Brand Assets
    section_order: 6
    section_field_order: 0
    question: Would you like us to follow your existing brand identity?
    hint: "This is about your BRAND IDENTITY (logo, colors, fonts, guidelines) \u2014\
      \ separate from any photos or videos you may have already uploaded."
    options:
      - label: Use My Saved Brand Kit
        value: use_my_saved_brand_kit
      - label: Upload Brand Guidelines
        value: upload_brand_guidelines
      - label: Upload Logo & Assets
        value: upload_logo_assets
      - label: Customize This Project
        value: customize_this_project
  - code: brand_customization
    kind: checkbox
    required: false
    section_name: Brand Assets
    section_order: 6
    section_field_order: 1
    question: What should we customize?
    hint: Only if you selected "Customize This Project" above.
    options:
      - label: Brand Colors
        value: brand_colors
      - label: Brand Fonts
        value: brand_fonts
      - label: Additional Instructions
        value: additional_instructions
    show_if:
      field: brand_customization
      in:
        - customize_this_project
  - code: brand_customization_details
    kind: text
    required: false
    section_name: Brand Assets
    section_order: 6
    section_field_order: 2
    question: Provide any additional brand customization details.
    hint: Only if you selected "Customize This Project" above.
    show_if:
      field: brand_customization
      in:
        - customize_this_project
  - code: visual_style
    kind: checkbox
    required: true
    section_name: Style & References
    section_order: 7
    section_field_order: 0
    question: What visual style should this asset have?
    hint: Choose up to 3.
    options:
      - label: Premium
        value: premium
      - label: Luxury
        value: luxury
      - label: Modern
        value: modern
      - label: Minimal
        value: minimal
      - label: Retail
        value: retail
      - label: Lifestyle
        value: lifestyle
      - label: Editorial
        value: editorial
      - label: Bold
        value: bold
      - label: Clean
        value: clean
      - label: Vibrant
        value: vibrant
      - label: Elegant
        value: elegant
      - label: High Contrast
        value: high_contrast
      - label: Match My Brand Style
        value: match_my_brand_style
  - code: inspiration_type
    kind: checkbox
    required: false
    section_name: Style & References
    section_order: 7
    section_field_order: 1
    question: Do you have any inspiration?
    hint: Share examples you like.
    options:
      - label: Website Link
        value: website_link
      - label: Instagram Link
        value: instagram_link
      - label: Pinterest Link
        value: pinterest_link
      - label: Upload Images
        value: upload_images
      - label: Skip
        value: skip
  - code: inspiration_links
    kind: text
    required: false
    section_name: Style & References
    section_order: 7
    section_field_order: 2
    question: Provide the reference link(s), or note that you're uploading images.
    hint: Only if you selected a reference option above (not Skip).
    show_if:
      field: inspiration_type
      not_in:
        - skip
  - code: where_will_this
    kind: checkbox
    required: true
    section_name: Placement & Format
    section_order: 8
    section_field_order: 0
    question: Where will this asset be used?
    options:
      - label: Website
        value: website
      - label: Email Campaign
        value: email_campaign
      - label: Google Ads
        value: google_ads
      - label: Meta Ads
        value: meta_ads
      - label: Amazon / Marketplace
        value: amazon_marketplace
      - label: Instagram
        value: instagram
      - label: Facebook
        value: facebook
      - label: WhatsApp
        value: whatsapp
      - label: Presentation
        value: presentation
      - label: Other
        value: other
  - code: size_or_format
    kind: radio
    required: true
    section_name: Placement & Format
    section_order: 8
    section_field_order: 1
    question: What size or format do you need?
    options:
      - label: Standard Platform Size
        value: standard_platform_size
      - label: Multiple Platform Sizes
        value: multiple_platform_sizes
      - label: Custom Dimensions
        value: custom_dimensions
  - code: provide_width_height
    kind: text
    required: false
    section_name: Placement & Format
    section_order: 8
    section_field_order: 2
    question: "Provide the width \xD7 height in pixels."
    hint: Only if you selected Custom Dimensions above.
  - code: copy_language
    kind: checkbox
    required: true
    section_name: Language & Notes
    section_order: 9
    section_field_order: 0
    question: What language should the design use?
    options:
      - label: English
        value: english
      - label: Hindi
        value: hindi
      - label: Tamil
        value: tamil
      - label: Telugu
        value: telugu
      - label: Malayalam
        value: malayalam
      - label: Kannada
        value: kannada
      - label: Arabic
        value: arabic
      - label: Spanish
        value: spanish
      - label: French
        value: french
      - label: German
        value: german
      - label: Portuguese
        value: portuguese
      - label: Chinese
        value: chinese
      - label: Japanese
        value: japanese
      - label: Korean
        value: korean
      - label: Urdu
        value: urdu
      - label: Other
        value: other
  - code: avoid_notes
    kind: text
    required: false
    section_name: Language & Notes
    section_order: 9
    section_field_order: 1
    question: Is there anything you'd like us to avoid?
    hint: Mention any colours, imagery, wording, or competitor references you'd prefer
      not to use.
