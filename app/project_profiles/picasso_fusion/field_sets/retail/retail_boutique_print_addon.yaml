  section_order: 4
  section_field_order: 0
  question: Is there anything that must appear?
  hint: Select all that apply.
  options:
  - label: Product Name
    value: product_name
  - label: Collection Name
    value: collection_name
  - label: Price
    value: price
  - label: Discount
    value: discount
  - label: Brand Logo
    value: brand_logo
  - label: Store Address
    value: store_address
  - label: Contact Number
