template_key: retail_boutique_print_addon
template_label: Print Design
vertical: retail
template_name_match:
- print design
- print add-on
- print addon
- print brief
- print material
fields:
- code: PT1
  kind: radio
  required: true
  section_name: Print Item & Message
  section_order: 0
  section_field_order: 0
  question: What are we creating today?
  hint: Select the print item.
  options:
  - label: Store Poster
    value: store_poster
  - label: Flyer
    value: flyer
  - label: Brochure
    value: brochure
  - label: Roll-up Standee
    value: roll_up_standee
  - label: Window Graphic
    value: window_graphic
  - label: Retail Banner
    value: retail_banner
  - label: Shelf Talker
    value: shelf_talker
  - label: Price Card / Shelf Label
    value: price_card_shelf_label
  - label: Product Catalogue
    value: product_catalogue
  - label: In-store Signage
    value: in_store_signage
  - label: Event Signage
    value: event_signage
  - label: Shopping Bag Insert
    value: shopping_bag_insert
  - label: Sticker / Label
    value: sticker_label
  - label: Other
    value: other
- code: PT2
  kind: text
  required: true
  section_name: Print Item & Message
  section_order: 0
  section_field_order: 1
  question: What are we promoting?
  hint: 'Provide the key details: Product/Collection/Campaign Name, Category, Price
    (Optional), Key Features/Benefits.'
- code: PT3
  kind: text
  required: true
  section_name: Print Item & Message
  section_order: 0
  section_field_order: 2
  question: What's the ONE message customers should remember?
  hint: "Describe the biggest reason someone should notice this print piece. Example:\
    \ \"Visit us for our biggest sale of the season.\", \"Discover our latest home\
    \ d\xE9cor collection.\", \"Exclusive offers available in-store only.\""
- code: PT4
  kind: checkbox
  required: true
  section_name: Goal & Audience
  section_order: 1
  section_field_order: 0
  question: What's the goal of this print piece?
  options:
  - label: Increase Store Visits
    value: increase_store_visits
  - label: Promote a Product
    value: promote_a_product
  - label: Launch a Collection
    value: launch_a_collection
  - label: Promote a Sale
    value: promote_a_sale
  - label: Build Brand Awareness
    value: build_brand_awareness
  - label: Guide Customers In-Store
    value: guide_customers_in_store
  - label: Event Promotion
    value: event_promotion
  - label: Other
    value: other
- code: PT5
  kind: text
  required: true
  section_name: Goal & Audience
  section_order: 1
  section_field_order: 1
  question: Who is this for?
  hint: Describe your ideal customer.
- code: PT6
  kind: radio
  required: true
  section_name: Offer
  section_order: 2
  section_field_order: 0
  question: Are you running an offer?
  options:
  - label: No Offer
    value: no_offer
  - label: Percentage Discount
    value: percentage_discount
  - label: Flat Discount
    value: flat_discount
  - label: Buy One Get One
    value: buy_one_get_one
  - label: Bundle Offer
    value: bundle_offer
  - label: Free Gift
    value: free_gift
  - label: Limited-Time Offer
    value: limited_time_offer
  - label: Other
    value: other
- code: PT7
  kind: text
  required: false
  section_name: Offer
  section_order: 2
  section_field_order: 1
