template_key: technology_services_web_banner_set
template_label: Web Banner Set
vertical: technology
template_name_match:
- web banner
- web banner set
- banner set
fields:
- code: WB1
  kind: checkbox
  required: true
  section_name: Banner Purpose
  section_order: 0
  section_field_order: 0
  question: What is the primary goal of these web banners?
  hint: 'Examples: Drive sales, Promote a product launch, Generate leads, Increase
    sign-ups, Promote an event, Drive traffic to a landing page.'
  options:
  - label: Drive Sales
    value: drive_sales
  - label: Promote a Product Launch
    value: promote_a_product_launch
  - label: Generate Leads
    value: generate_leads
  - label: Increase Sign-Ups
    value: increase_sign_ups
  - label: Promote an Event
    value: promote_an_event
  - label: Drive Traffic to a Landing Page
    value: drive_traffic_to_a_landing_page
  - label: Other
    value: other
- code: WB2
  kind: checkbox
  required: true
  section_name: Banner Purpose
  section_order: 0
  section_field_order: 1
  question: Where will these banners appear?
  hint: This is more useful than asking about homepage hero vs sidebar first.
  options:
  - label: Website Homepage
    value: website_homepage
  - label: Website Internal Pages
    value: website_internal_pages
  - label: Blog/Sidebar
    value: blog_sidebar
  - label: Landing Page
    value: landing_page
  - label: Display Advertising
    value: display_advertising
  - label: Retargeting Campaign
    value: retargeting_campaign
  - label: Other
    value: other
- code: WB3
  kind: text
  required: true
  section_name: Campaign Information
  section_order: 1
  section_field_order: 0
  question: What is being promoted?
  hint: Provide the product, service, feature, offer, event, or campaign details.
- code: WB4
  kind: checkbox
  required: true
  section_name: Campaign Information
  section_order: 1
  section_field_order: 1
  question: Who is the target audience?
  hint: 'Examples: Existing customers, New visitors, Small businesses, Enterprise
    buyers, Students, Homeowners, Healthcare professionals.'
  options:
  - label: Existing Customers
    value: existing_customers
  - label: New Visitors
    value: new_visitors
  - label: Small Businesses
    value: small_businesses
  - label: Enterprise Buyers
    value: enterprise_buyers
  - label: Students
    value: students
  - label: Homeowners
    value: homeowners
  - label: Healthcare Professionals
    value: healthcare_professionals
  - label: Other
    value: other
- code: WB5
  kind: radio
  required: true
  section_name: Banner Sizes
  section_order: 2
  section_field_order: 0
  question: What banner sizes are required?
  hint: "This is a 3-size package by default \u2014 confirm the standard set works,\
    \ or request custom sizes."
  options:
  - label: Standard Display Ad Sizes
    value: standard_display_ad_sizes
  - label: Social Display Sizes
    value: social_display_sizes
  - label: Custom Sizes
    value: custom_sizes
- code: WB6
  kind: text
  required: false
  section_name: Banner Sizes
  section_order: 2
  section_field_order: 1
  question: Please provide the exact pixel dimensions.
  hint: Only if you selected Custom Sizes above.
  show_if:
    field: WB5
    in:
    - custom_size
- code: WB7
  kind: text
  required: true
  section_name: Content & Assets
  section_order: 3
  section_field_order: 0
  question: What copy should appear on the banners?
  hint: Headline, supporting text, offer details, and CTA copy.
- code: WB8
  kind: radio
  required: true
  section_name: Content & Assets
  section_order: 3
  section_field_order: 1
  question: Do you have images, product screenshots, or visuals to use?
  options:
  - label: 'Yes'
    value: 'yes'
  - label: 'No'
    value: 'no'
- code: WB9
  kind: file
  required: false
  section_name: Content & Assets
  section_order: 3
  section_field_order: 2
  question: Upload assets.
  hint: PNG or JPG preferred. Minimum 1200px wide. Only if you have images, product
    screenshots, or visuals.
- code: WB10
  kind: radio
  required: true
  section_name: Call to Action
  section_order: 4
  section_field_order: 0
  question: What action should users take after clicking the banner?
  hint: 'Examples: Shop Now, Learn More, Book a Demo, Register, Download, Get Started.'
  options:
  - label: Shop Now
    value: shop_now
  - label: Learn More
    value: learn_more
  - label: Book a Demo
    value: book_a_demo
  - label: Register
    value: register
  - label: Download
    value: download
  - label: Get Started
    value: get_started
  - label: Other
    value: other
- code: WB11
  kind: text
  required: true
  section_name: Call to Action
  section_order: 4
  section_field_order: 1
  question: What is the destination URL?
- code: WB12
  kind: radio
  required: true
  section_name: Call to Action
  section_order: 4
  section_field_order: 2
  question: Will UTM tracking be required?
  options:
  - label: 'Yes'
    value: 'yes'
  - label: 'No'
    value: 'no'
- code: WB13
  kind: text
  required: false
  section_name: Call to Action
  section_order: 4
  section_field_order: 3
  question: Provide UTM parameters or confirm AI-generated UTMs.
  hint: Only if you said yes above.
  show_if:
    field: WB12
    in:
    - 'yes'
- code: WB14
  kind: radio
  required: true
  section_name: Design Direction
  section_order: 5
  section_field_order: 0
  question: Any reference banners or inspiration?
  hint: Share examples, competitors, or campaigns you admire.
  options:
  - label: 'Yes'
    value: 'yes'
  - label: 'No'
    value: 'no'
- code: WB15
  kind: file
  required: false
  section_name: Design Direction
  section_order: 5
  section_field_order: 1
  question: Upload references, up to 3.
  hint: Only if you said yes to reference banners above.
  show_if:
    field: WB14
    in:
    - 'yes'
- code: WB16
  kind: radio
  required: true
  section_name: Design Direction
  section_order: 5
  section_field_order: 2
  question: Describe the visual style you'd like.
  hint: 'Examples: Modern SaaS, Premium, Minimal, Product-focused, Corporate, Luxury,
    Bold promotional.'
  options:
  - label: Modern SaaS
    value: modern_saas
  - label: Premium
    value: premium
  - label: Minimal
    value: minimal
  - label: Product-Focused
    value: product_focused
  - label: Corporate
    value: corporate
  - label: Luxury
    value: luxury
  - label: Bold Promotional
    value: bold_promotional
  - label: Other
    value: other
- code: WB17
  kind: radio
  required: true
  section_name: Technical Requirements
  section_order: 6
  section_field_order: 0
  question: Will these banners be static or animated?
  hint: This is a critical question currently missing.
  options:
  - label: Static JPG/PNG
    value: static_jpg_png
  - label: Animated GIF
    value: animated_gif
  - label: HTML5 Banner
    value: html5_banner
- code: WB18
  kind: checkbox
  required: false
  section_name: Technical Requirements
  section_order: 6
  section_field_order: 1
  question: Any platform-specific requirements?
  hint: 'Examples: Google Display Network, Programmatic Ads, Internal Website.'
  options:
  - label: Google Display Network
    value: google_display_network
  - label: Programmatic Ads
    value: programmatic_ads
  - label: Internal Website
    value: internal_website
  - label: Other
    value: other
- code: WB19
  kind: text
  required: false
  section_name: Technical Requirements
  section_order: 6
  section_field_order: 2
  question: Any technical requirements?
  hint: Leave blank if unsure.
