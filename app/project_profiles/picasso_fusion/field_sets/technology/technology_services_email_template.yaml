template_key: technology_services_email_template
template_label: Email Template
vertical: technology
template_name_match:
  - email template
fields:
  - code: content_structure
    kind: radio
    required: true
    section_name: Email Purpose
    section_order: 0
    section_field_order: 0
    question: What type of email template do you need?
    options:
      - label: Newsletter
        value: newsletter
      - label: Product Updates
        value: product_updates
      - label: Promotional Emails
        value: promotional_emails
      - label: Event Invitations
        value: event_invitations
      - label: Customer Onboarding
        value: customer_onboarding
      - label: Customer Retention
        value: customer_retention
      - label: Transactional Emails
        value: transactional_emails
      - label: Internal Communications
        value: internal_communications
      - label: Other
        value: other
  - code: post_goal
    kind: checkbox
    required: true
    section_name: Template Goal
    section_order: 1
    section_field_order: 0
    question: What is the primary goal of this email template?
    hint: 'Examples: Drive website traffic, Generate leads, Promote products, Share
      company updates, Register for events, Educate customers.'
    options:
      - label: Drive Website Traffic
        value: drive_website_traffic
      - label: Generate Leads
        value: generate_leads
      - label: Promote Products
        value: promote_products
      - label: Share Company Updates
        value: share_company_updates
      - label: Register for Events
        value: register_for_events
      - label: Educate Customers
        value: educate_customers
      - label: Other
        value: other
  - code: which_email_platform
    kind: radio
    required: true
    section_name: Email Platform
    section_order: 2
    section_field_order: 0
    question: Which email platform will this template be used in?
    hint: This should be one of the first questions because it affects how the template
      is built.
    options:
      - label: Mailchimp
        value: mailchimp
      - label: Klaviyo
        value: klaviyo
      - label: HubSpot
        value: hubspot
      - label: ActiveCampaign
        value: activecampaign
      - label: Brevo
        value: brevo
      - label: Campaign Monitor
        value: campaign_monitor
      - label: Salesforce Marketing Cloud
        value: salesforce_marketing_cloud
      - label: Other
        value: other
  - code: which_sections_should
    kind: checkbox
    required: true
    section_name: Content Structure
    section_order: 3
    section_field_order: 0
    question: Which sections should be included in the template?
    options:
      - label: Hero Banner
        value: hero_banner
      - label: Intro Text
        value: intro_text
      - label: Featured Article
        value: featured_article
      - label: Product Grid
        value: product_grid
      - label: Event Section
        value: event_section
      - label: Testimonials
        value: testimonials
      - label: Call-to-Action Section
        value: cta_section
      - label: Social Links
        value: social_links
      - label: Footer
        value: footer
      - label: Other
        value: other
  - code: have_photography_product
    kind: radio
    required: true
    section_name: Content & Assets
    section_order: 4
    section_field_order: 0
    question: Do you have photography, product images, illustrations, or brand assets
      to use?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: upload_assets
    kind: file
    required: false
    section_name: Content & Assets
    section_order: 4
    section_field_order: 1
    question: Upload assets.
    hint: Only if you have photography, product images, illustrations, or brand assets.
  - code: will_this_template
    kind: radio
    required: true
    section_name: Calls to Action
    section_order: 5
    section_field_order: 0
    question: Will this template include call-to-action buttons?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: cta_buttons_should
    kind: checkbox
    required: false
    section_name: Calls to Action
    section_order: 5
    section_field_order: 1
    question: What CTA buttons should be available in the template?
    hint: Only if you said yes above.
    options:
      - label: Learn More
        value: learn_more
      - label: Shop Now
        value: shop_now
      - label: Register
        value: register
      - label: Book a Demo
        value: book_a_demo
      - label: Contact Us
        value: contact_us
      - label: Other
        value: other
    show_if:
      field: cta_buttons_should
      in:
        - 'yes'
  - code: will_links_this
    kind: radio
    required: true
    section_name: Tracking Requirements
    section_order: 6
    section_field_order: 0
    question: Will links in this template require UTM tracking?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: provide_utm_parameters
    kind: text
    required: false
    section_name: Tracking Requirements
    section_order: 6
    section_field_order: 1
    question: Provide UTM parameters or confirm AI-generated UTMs.
    hint: Only if you said yes above.
    show_if:
      field: will_links_this
      in:
        - 'yes'
  - code: inspiration_type
    kind: radio
    required: true
    section_name: Design Direction
    section_order: 7
    section_field_order: 0
    question: Any reference email designs or inspiration?
    options:
      - label: 'Yes'
        value: 'yes'
      - label: 'No'
        value: 'no'
  - code: upload_references
    kind: file
    required: false
    section_name: Design Direction
    section_order: 7
    section_field_order: 1
    question: Upload reference emails, up to 3.
    hint: Only if you said yes to reference email designs above.
    show_if:
      field: inspiration_type
      in:
        - 'yes'
  - code: describe_email_design
    kind: radio
    required: true
    section_name: Design Direction
    section_order: 7
    section_field_order: 2
    question: Describe the email design style you'd like.
    options:
      - label: Minimal
        value: minimal
      - label: Corporate
        value: corporate
      - label: Premium
        value: premium
      - label: Editorial
        value: editorial
      - label: Product-Focused
        value: product_focused
      - label: Modern SaaS
        value: modern_saas
      - label: Bold and Promotional
        value: bold_and_promotional
      - label: Other
        value: other
  - code: require_a_fully
    kind: radio
    required: true
    section_name: Technical Requirements
    section_order: 8
    section_field_order: 0
    question: Do you require a fully coded HTML email or a design-only template?
    hint: This is a critical question that's currently missing.
    options:
      - label: Fully Coded HTML Email
        value: fully_coded_html_email
      - label: Design Only
        value: design_only
      - label: Not Sure
        value: not_sure
  - code: any_technical_accessibility
    kind: text
    required: false
    section_name: Additional Requirements
    section_order: 9
    section_field_order: 0
    question: Any technical, accessibility, or platform-specific requirements?
    hint: Leave blank if unsure.
