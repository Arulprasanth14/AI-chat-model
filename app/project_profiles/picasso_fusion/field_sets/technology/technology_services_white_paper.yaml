template_key: technology_services_white_paper
template_label: White Paper
vertical: technology
template_name_match:
- white paper
- whitepaper
- report cover
fields:
- code: WP1
  kind: text
  required: true
  section_name: Report Overview
  section_order: 0
  section_field_order: 0
  question: What is the title of the white paper or report?
  hint: Provide the exact title as it should appear on the cover.
- code: WP2
  kind: text
  required: true
  section_name: Report Overview
  section_order: 0
  section_field_order: 1
  question: What is the report about?
  hint: Provide a brief summary of the report's topic, findings, or purpose.
- code: WP3
  kind: text
  required: true
  section_name: Report Overview
  section_order: 0
  section_field_order: 2
  question: Who is the intended audience?
  hint: 'Examples: Executives, investors, healthcare professionals, policymakers,
    researchers, customers, etc.'
- code: WP4
  kind: text
  required: true
  section_name: Report Overview
  section_order: 0
  section_field_order: 3
  question: How many pages does the report contain?
  hint: This helps determine spine requirements and cover layout considerations.
- code: WP5
  kind: text
  required: true
  section_name: Cover Content
  section_order: 1
  section_field_order: 0
  question: What text should appear on the cover?
  hint: Include title, subtitle, author name, company name, publication date, edition
    number, or any other required content.
- code: WP6
  kind: radio
  required: true
  section_name: Cover Content
  section_order: 1
  section_field_order: 1
  question: Should the cover include any call to action?
  options:
  - label: Download the Full Report
    value: download_the_full_report
  - label: Visit Our Website
    value: visit_our_website
  - label: Contact Us
    value: contact_us
  - label: Scan a QR Code
    value: scan_a_qr_code
  - label: No Call to Action
    value: no_call_to_action
- code: WP7
  kind: text
  required: false
  section_name: Cover Content
  section_order: 1
  section_field_order: 2
  question: What is the destination URL for the QR code?
  hint: Only if you selected Scan a QR Code above.
  show_if:
    field: WP6
    in:
    - scan_a_qr_code
    - scan_qr_code
- code: WP8
  kind: radio
  required: true
  section_name: Images & Assets
  section_order: 2
  section_field_order: 0
  question: Do you have photography, illustrations, charts, or imagery for the cover?
  hint: Print assets should be a minimum of 300 DPI at final print size.
  options:
  - label: 'Yes'
    value: 'yes'
  - label: 'No'
    value: 'no'
- code: WP9
  kind: file
  required: false
  section_name: Images & Assets
  section_order: 2
  section_field_order: 1
  question: Upload print-ready assets.
  hint: Only if you have photography, illustrations, charts, or imagery for the cover.
- code: WP10
  kind: radio
  required: true
  section_name: Design Direction
  section_order: 3
  section_field_order: 0
  question: Any reference designs or inspiration?
  hint: Share examples, competitor reports, previous editions, or styles you admire.
  options:
  - label: 'Yes'
    value: 'yes'
  - label: 'No'
    value: 'no'
- code: WP11
  kind: file
  required: false
  section_name: Design Direction
  section_order: 3
  section_field_order: 1
  question: Upload reference designs, up to 3.
  hint: Only if you said yes to reference designs above.
  show_if:
    field: WP10
    in:
    - 'yes'
- code: WP12
  kind: radio
  required: true
  section_name: Design Direction
  section_order: 3
  section_field_order: 2
  question: Describe the visual style you'd like.
  options:
  - label: Corporate
    value: corporate
  - label: Premium
    value: premium
  - label: Editorial
    value: editorial
  - label: Academic
    value: academic
  - label: Data-Driven
    value: data_driven
  - label: Modern
    value: modern
  - label: Minimalist
    value: minimalist
  - label: Technology-Focused
    value: technology_focused
  - label: Sustainability-Focused
    value: sustainability_focused
  - label: Other
    value: other
- code: WP13
  kind: radio
  required: true
  section_name: Production Requirements
  section_order: 4
  section_field_order: 0
  question: Is this cover for print, digital PDF distribution, or both?
  hint: This is actually more important than asking technical requirements first because
    digital report covers are designed differently from printed covers.
  options:
  - label: Print
    value: print
  - label: Digital PDF Distribution
    value: digital_pdf_distribution
  - label: Both
    value: both
- code: WP14
  kind: text
  required: false
  section_name: Production Requirements
  section_order: 4
  section_field_order: 1
  question: Any technical or print-specific requirements?
  hint: "Leave blank if unsure \u2014 we'll use standard specifications."
