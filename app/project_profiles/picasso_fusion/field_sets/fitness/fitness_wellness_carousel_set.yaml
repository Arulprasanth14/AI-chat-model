    \ 3 \u2192 Mistake 2; Slide 4 \u2192 Mistake 3; Slide 5 \u2192 Solution; Slide\
    \ 6 \u2192 Summary; Slide 7 \u2192 CTA. This gives designers freedom while still\
    \ understanding the narrative."
