template_key: fitness_wellness_digital_addon
template_label: Digital Asset
vertical: fitness
template_name_match:
  - digital design
  - digital add-on
  - digital addon
  - digital brief
  - digital asset
fields:
  - code: post_purpose
    kind: radio
    required: true
    section_name: Digital Asset & Message
    section_order: 0
    section_field_order: 0
    question: What are we creating today?
    hint: Select the digital asset.
    options:
      - label: Website Banner
        value: website_banner
      - label: Email Header
        value: email_header
      - label: Email Newsletter (EDM)
        value: email_newsletter_edm
      - label: Google Display Ads
        value: google_display_ads
      - label: Meta Ad Creative
        value: meta_ad_creative
      - label: LinkedIn Banner
        value: linkedin_banner
      - label: Instagram Story Set
        value: instagram_story_set
      - label: WhatsApp Graphic
        value: whatsapp_graphic
      - label: Presentation Deck
        value: presentation_deck
      - label: Digital Menu Board
        value: digital_menu_board
      - label: Website Popup
        value: website_popup
      - label: Other
        value: other
  - code: key_message
    kind: text
    required: true
    section_name: Digital Asset & Message
    section_order: 0
    section_field_order: 1
    question: What's the one message people should remember?
    hint: "Describe the main purpose of this asset. Example: \"Summer Sale \u2013\
      \ Up to 40% Off\", \"Register for our Webinar\", \"Introducing our new product\"\
      ."
  - code: post_goal
    kind: checkbox
    required: true
    section_name: Goal & Audience
    section_order: 1
    section_field_order: 0
    question: What's the goal of this asset?
    options:
      - label: Generate Leads
        value: generate_leads
      - label: Increase Sales
        value: increase_sales
      - label: Website Traffic
        value: website_traffic
      - label: Brand Awareness
        value: brand_awareness
      - label: Product Launch
        value: product_launch
      - label: Event Promotion
        value: event_promotion
      - label: Customer Communication
        value: customer_communication
      - label: Internal Presentation
        value: internal_presentation
      - label: Other
        value: other
  - code: target_audience
    kind: text
    required: true
    section_name: Goal & Audience
    section_order: 1
    section_field_order: 1
    question: Who is this for?
    hint: Describe your target audience.
  - code: action_should_people
    kind: radio
    required: true
    section_name: Goal & Audience
    section_order: 1
    section_field_order: 2
    question: What action should people take?
    options:
      - label: Visit Website
        value: visit_website
      - label: Shop Now
        value: shop_now
      - label: Register
        value: register
      - label: Book Now
        value: book_now
      - label: Download
        value: download
      - label: Learn More
        value: learn_more
      - label: Contact Us
        value: contact_us
      - label: Reply to Email
        value: reply_to_email
      - label: Other
        value: other
  - code: promoted_item
    kind: text
    required: true
    section_name: Content
    section_order: 2
    section_field_order: 0
    question: What are you promoting?
    hint: 'Provide the important information: Product/Service Name, Offer Details,
      Price, Key Benefits, Dates, Terms & Conditions.'
  - code: already_have_content
    kind: radio
    required: true
    section_name: Content
    section_order: 2
    section_field_order: 1
    question: Do you already have the content?
    options:
      - label: Final Copy Ready
        value: final_copy_ready
      - label: Rough Points
        value: rough_points
      - label: Need Copywriting Support
        value: need_copywriting_support
  - code: provide_your_final
    kind: text
    required: false
    section_name: Content
    section_order: 2
    section_field_order: 2
    question: Provide your final copy or rough points.
    hint: Only if you have final copy ready or rough points.
  - code: design_requirements
    kind: checkbox
    required: false
    section_name: Design Requirements
    section_order: 3
    section_field_order: 0
    question: Is there anything that must appear?
    hint: Select all that apply.
    options:
      - label: Logo
        value: logo
      - label: Product Image
        value: product_image
      - label: Price
        value: price
      - label: Offer Details
        value: offer_details
      - label: QR Code
        value: qr_code
      - label: Website
        value: website
      - label: Phone Number
        value: phone_number
      - label: Social Media Handles
        value: social_media_handles
      - label: Terms & Conditions
        value: terms_conditions
      - label: Sponsor Logo
        value: sponsor_logo
      - label: Other
        value: other
  - code: have_images_or
    kind: checkbox
    required: true
    section_name: Images & Assets
    section_order: 4
    section_field_order: 0
    question: Do you have images or assets?
    options:
      - label: I'll Upload Images
        value: ill_upload_images
      - label: I'll Upload Product Photos
        value: ill_upload_product_photos
      - label: I'll Upload Graphics
        value: ill_upload_graphics
      - label: Use Stock Images
        value: use_stock_images
      - label: Use Only Brand Assets
        value: use_only_brand_assets
      - label: Designer Can Decide
        value: designer_can_decide
  - code: uploaded_files
    kind: file
    required: false
    section_name: Images & Assets
    section_order: 4
    section_field_order: 1
    question: Upload your files.
    hint: Upload logos, images, product photos, presentations, or supporting assets.
    show_if:
      field: have_images_or
      in:
        - ill_upload_images
        - ill_upload_product_photos
        - ill_upload_graphics
  - code: brand_identity_choice
    kind: radio
    required: true
    section_name: Brand Assets
    section_order: 5
    section_field_order: 0
    question: Would you like us to follow your existing brand identity?
    hint: "This is about your BRAND IDENTITY (logo, colors, fonts, guidelines) \u2014\
      \ separate from any photos or videos you may have already uploaded."
    options:
      - label: Use My Saved Brand Kit
        value: use_my_saved_brand_kit
      - label: Upload Brand Guidelines
        value: upload_brand_guidelines
      - label: Upload Logo & Assets
        value: upload_logo_assets
      - label: Customize This Project
        value: customize_this_project
  - code: brand_customization
    kind: checkbox
    required: false
    section_name: Brand Assets
    section_order: 5
    section_field_order: 1
    question: What should we customize?
    hint: Only if you selected "Customize This Project" above.
    options:
      - label: Brand Colors
        value: brand_colors
      - label: Brand Fonts
        value: brand_fonts
      - label: Additional Instructions
        value: additional_instructions
    show_if:
      field: brand_customization
      in:
        - customize_this_project
  - code: brand_customization_details
    kind: text
    required: false
    section_name: Brand Assets
    section_order: 5
    section_field_order: 2
    question: Provide any additional brand customization details.
    hint: Only if you selected "Customize This Project" above.
    show_if:
      field: brand_customization
      in:
        - customize_this_project

  - code: brand_uploaded_files
    kind: file
    required: false
    section_name: Brand Assets
    section_field_order: 3
    question: Please upload your brand files.
    hint: Upload your logo, brand guidelines, or any other brand assets (PNG, JPG, PDF, AI, EPS).
    show_if:
      field: brand_identity_choice
      in:
        - upload_brand_guidelines
        - upload_logo_assets
  - code: visual_style
    kind: checkbox
    required: true
    section_name: Style & References
    section_order: 6
    section_field_order: 0
    question: What visual style should this asset have?
    hint: Choose up to 3.
    options:
      - label: Premium
        value: premium
      - label: Modern
        value: modern
      - label: Minimal
        value: minimal
      - label: Luxury
        value: luxury
      - label: Bold
        value: bold
      - label: Corporate
        value: corporate
      - label: Professional
        value: professional
      - label: Editorial
        value: editorial
      - label: Clean
        value: clean
      - label: High Impact
        value: high_impact
      - label: Tech
        value: tech
      - label: Fun
        value: fun
      - label: Elegant
        value: elegant
      - label: Match My Brand Style
        value: match_my_brand_style
  - code: inspiration_type
    kind: checkbox
    required: false
    section_name: Style & References
    section_order: 6
    section_field_order: 1
    question: Do you have any inspiration?
    hint: Share examples you like.
    options:
      - label: Website Link
        value: website_link
      - label: Pinterest Link
        value: pinterest_link
      - label: Upload Images
        value: upload_images
      - label: Skip
        value: skip
  - code: inspiration_links
    kind: text
    required: false
    section_name: Style & References
    section_order: 6
    section_field_order: 2
    question: Provide the reference link(s), or note that you're uploading images.
    hint: Only if you selected a reference option above (not Skip).
    show_if:
      field: inspiration_type
      not_in:
        - skip
  - code: where_will_this
    kind: checkbox
    required: true
    section_name: Placement & Format
    section_order: 7
    section_field_order: 0
    question: Where will this asset be used?
    options:
      - label: Website
        value: website
      - label: Email Campaign
        value: email_campaign
      - label: Google Ads
        value: google_ads
      - label: Meta Ads
        value: meta_ads
      - label: LinkedIn
        value: linkedin
      - label: Instagram
        value: instagram
      - label: WhatsApp
        value: whatsapp
      - label: Presentation
        value: presentation
      - label: Digital Signage
        value: digital_signage
      - label: Other
        value: other
  - code: size_or_format
    kind: radio
    required: true
    section_name: Placement & Format
    section_order: 7
    section_field_order: 1
    question: What size or format do you need?
    options:
      - label: Standard Platform Size
        value: standard_platform_size
      - label: Multiple Platform Sizes
        value: multiple_platform_sizes
      - label: Custom Dimensions
        value: custom_dimensions
  - code: provide_width_height
    kind: text
    required: false
    section_name: Placement & Format
    section_order: 7
    section_field_order: 2
    question: "Provide the width \xD7 height in pixels."
    hint: Only if you selected Custom Dimensions above.
  - code: copy_language
    kind: checkbox
    required: true
    section_name: Language & Notes
    section_order: 8
    section_field_order: 0
    question: What language should the design use?
    options:
      - label: English
        value: english
      - label: Hindi
        value: hindi
      - label: Tamil
        value: tamil
      - label: Telugu
        value: telugu
      - label: Malayalam
        value: malayalam
      - label: Kannada
        value: kannada
      - label: Arabic
        value: arabic
      - label: Spanish
        value: spanish
      - label: French
        value: french
      - label: German
        value: german
      - label: Portuguese
        value: portuguese
      - label: Chinese
        value: chinese
      - label: Japanese
        value: japanese
      - label: Korean
        value: korean
      - label: Urdu
        value: urdu
      - label: Other
        value: other
  - code: avoid_notes
    kind: text
    required: false
    section_name: Language & Notes
    section_order: 8
    section_field_order: 1
    question: Is there anything you'd like us to avoid?
    hint: Mention any colours, imagery, wording, styles, or competitors you'd prefer
      not to reference.
